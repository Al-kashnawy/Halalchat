function communityModal(){showModal(`<h2>Create a community</h2><div class="field"><label>Name</label><input id="cName" maxlength="60" placeholder="Abuja Muslim Students"></div><div class="field"><label>Description</label><textarea id="cDesc" maxlength="240" rows="3" placeholder="What is this community for?"></textarea></div><div class="field"><label>Type</label><select id="cType"><option value="mosque">Mosque / masjid</option><option value="university">University / MSA</option><option value="quran">Quran / study</option><option value="professional">Professional</option><option value="local">Local community</option><option value="other">Other</option></select></div><div class="field"><label>Visibility</label><select id="cVisibility"><option value="public">Public — discoverable</option><option value="private">Private — invite only</option></select></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="createCommunity">Create</button></div>`);$('createCommunity').onclick=async()=>{const name=$('cName').value.trim(),description=$('cDesc').value.trim(),type=$('cType').value,visibility=$('cVisibility').value;if(!state.user||state.user.isAnonymous){closeModal();authModal();toast('Create a free account first to create a community');return}if(!name){toast('Give the community a name');return}try{const ref=await addDoc(collection(db,'communities'),{name,description,type,visibility,ownerId:state.user.uid,memberCount:1,verified:false,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await setDoc(doc(db,'communities',ref.id,'members',state.user.uid),{role:'owner',status:'active',joinedAt:serverTimestamp()});await setDoc(doc(db,'users',state.user.uid,'memberships',ref.id),{communityId:ref.id,role:'owner',joinedAt:serverTimestamp()});await setDoc(doc(db,'communities',ref.id,'channels','general'),{name:'general',description:'Community-wide conversation',createdBy:state.user.uid,createdAt:serverTimestamp()});const created={id:ref.id,name,description,type,visibility,ownerId:state.user.uid,memberCount:1,verified:false,createdAt:null,updatedAt:null};state.communities=[created,...state.communities.filter(x=>x.id!==ref.id)];renderCommunityList();await loadCommunities();if(!state.communities.some(x=>x.id===ref.id))state.communities=[created,...state.communities];closeModal();openCommunity(ref.id);toast('Community created')}catch(e){console.error(e);toast('Could not create community: '+(e.code||e.message||'unknown error'))}}}
async function ensureProfile(){const ref=doc(db,'users',state.user.uid),snap=await getDoc(ref);if(!snap.exists()){const name=state.user.displayName||localStorage.getItem('halalchat_displayName')||'Muslim user';await setDoc(ref,{displayName:name,bio:'',location:'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}state.profile=(await getDoc(ref)).data();localStorage.setItem('halalchat_displayName',state.profile.displayName||'Muslim user')}
let communityListeners=new Map(),communityRootListeners=[];
function stopCommunitySubscriptions(){communityRootListeners.forEach(u=>u&&u());communityRootListeners=[];communityListeners.forEach(u=>u&&u());communityListeners.clear()}
function sortCommunities(list){return list.sort((a,b)=>{const at=a.createdAt?.toMillis?a.createdAt.toMillis():(a.createdAt?.seconds||0)*1000;const bt=b.createdAt?.toMillis?b.createdAt.toMillis():(b.createdAt?.seconds||0)*1000;return bt-at})}
function upsertCommunityDoc(d){if(!d.exists()){const unsub=communityListeners.get(d.id);if(unsub)unsub();communityListeners.delete(d.id);state.communities=state.communities.filter(c=>c.id!==d.id);renderCommunityList();return}const c={id:d.id,...d.data()};const idx=state.communities.findIndex(x=>x.id===c.id);if(idx>=0)state.communities[idx]=c;else state.communities.push(c);sortCommunities(state.communities);renderCommunityList();if(state.currentCommunity?.id===c.id){state.currentCommunity=c;const title=$('communityTitle'),meta=$('communityMeta');if(title)title.textContent=c.name;if(meta)meta.textContent=`${c.memberCount||0} members • ${c.visibility==='private'?'Private':'Public'}`} }
function ensureCommunityListener(id){if(communityListeners.has(id))return;const unsub=onSnapshot(doc(db,'communities',id),d=>upsertCommunityDoc(d),e=>{console.error('community listener',id,e);if(e.code!=='permission-denied')toast('A community could not be updated in real time')});communityListeners.set(id,unsub)}
function subscribeCommunities(){stopCommunitySubscriptions();if(!state.user)return;const mergeSnapshot=snap=>{snap.docs.forEach(d=>ensureCommunityListener(d.id));renderCommunityList()};const publicQ=query(collection(db,'communities'),where('visibility','==','public'),limit(100));const ownQ=query(collection(db,'communities'),where('ownerId','==',state.user.uid),limit(100));const memberQ=query(collection(db,'users',state.user.uid,'memberships'),limit(100));communityRootListeners.push(onSnapshot(publicQ,mergeSnapshot,e=>console.error('public communities listener',e)));communityRootListeners.push(onSnapshot(ownQ,mergeSnapshot,e=>console.error('owned communities listener',e)));communityRootListeners.push(onSnapshot(memberQ,snap=>{const ids=new Set(snap.docs.map(d=>d.id));snap.docs.forEach(d=>ensureCommunityListener(d.id));const keep=new Set(ids);state.communities=state.communities.filter(c=>c.visibility==='public'||c.ownerId===state.user.uid||keep.has(c.id));state.communities.forEach(c=>{if(c.visibility!=='public'&&c.ownerId!==state.user.uid&&!keep.has(c.id)){const u=communityListeners.get(c.id);if(u)u();communityListeners.delete(c.id)}});renderCommunityList()},e=>console.error('membership listener',e)))}
async function loadCommunities(){try{const publicSnap=await getDocs(query(collection(db,'communities'),where('visibility','==','public'),limit(100)));const own=await getDocs(query(collection(db,'communities'),where('ownerId','==',state.user.uid),limit(100)));const memberships=await getDocs(query(collection(db,'users',state.user.uid,'memberships'),limit(100)));const map=new Map();publicSnap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));own.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));for(const m of memberships.docs){const d=await getDoc(doc(db,'communities',m.id));if(d.exists())map.set(d.id,{id:d.id,...d.data()})}state.communities=sortCommunities([...map.values()]);renderCommunityList();subscribeCommunities()}catch(e){console.error('loadCommunities error',e);toast('Could not load communities: '+(e.code||e.message||'unknown error'))}}
function renderCommunityList(){$('communityList').innerHTML=state.communities.length?state.communities.slice(0,14).map(c=>`<button class="community-item ${state.currentCommunity?.id===c.id?'active':''}" data-cid="${c.id}"><div class="avatar">${initials(c.name)}</div><div class="meta"><strong>${esc(c.name)} ${c.verified?'✓':''}</strong><span>${c.visibility==='private'?'Private':'Public'} · ${c.memberCount||1} members</span></div></button>`).join(''):`<div class="empty" style="padding:12px 4px">No communities yet.</div>`;document.querySelectorAll('[data-cid]').forEach(x=>x.onclick=()=>openCommunity(x.dataset.cid))}
async function joinCommunity(id){const c=state.communities.find(x=>x.id===id);if(!c)return;try{const cref=doc(db,'communities',id),mref=doc(db,'communities',id,'members',state.user.uid),uref=doc(db,'users',state.user.uid,'memberships',id);await runTransaction(db,async tx=>{const cs=await tx.get(cref),ms=await tx.get(mref);if(ms.exists())return;const oldCount=cs.data().memberCount||0;tx.set(mref,{role:'member',status:'active',joinedAt:serverTimestamp()});tx.set(uref,{communityId:id,role:'member',joinedAt:serverTimestamp()});tx.update(cref,{memberCount:oldCount+1,updatedAt:serverTimestamp()})});await loadCommunities();openCommunity(id);toast('Joined community')}catch(e){console.error(e);toast('Could not join this community')}}
async function openCommunity(id){let c=state.communities.find(x=>x.id===id);if(!c){try{const snap=await getDoc(doc(db,'communities',id));if(snap.exists()){c={id:snap.id,...snap.data()};state.communities.push(c)}}catch(e){console.error('openCommunity fallback fetch failed',e)}}if(!c){toast('Could not open this community. Try reopening it from Home.');return}const member=await getDoc(doc(db,'communities',id,'members',state.user.uid));if(!member.exists()&&c.ownerId!==state.user.uid){if(c.visibility==='public'){showModal(`<h2>${esc(c.name)}</h2><p>${esc(c.description||'Join this Muslim community.')}</p><div class="notice">This is a public community. Join to participate in its channels.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="joinNow">Join community</button></div>`);$('joinNow').onclick=()=>{closeModal();joinCommunity(id)};return}toast('This community is private. Use an invite link/code from an administrator.');return}state.currentCommunity=c;state.currentChannel='general';nav('community')}
function communityInfo(){const c=state.currentCommunity;if(!c)return;showModal(`<h2>${esc(c.name)} ${c.verified?'✓':''}</h2><p style="color:var(--muted)">${esc(c.description||'')}</p><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h3>${c.memberCount||1}</h3><p>Members</p></div><div class="card"><h3>${c.visibility==='private'?'Private':'Public'}</h3><p>Community type</p></div></div><div class="section-head"><h2>Admin tools</h2></div><div class="tabs"><button class="tab" id="inviteBtn">Invite members</button><button class="tab" id="manageBtn">Manage members</button><button class="tab" id="leaveBtn">Leave</button>${c.ownerId===state.user.uid?'<button class="tab danger" id="deleteCommunityBtn">Delete community</button>':''}</div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Done</button></div>`);$('inviteBtn').onclick=()=>inviteModal(c);$('manageBtn').onclick=()=>memberManager(c);$('leaveBtn').onclick=()=>leaveCommunity(c);if(c.ownerId===state.user.uid)$('deleteCommunityBtn').onclick=()=>deleteCommunity(c)}
async function deleteCommunity(c){if(!c||c.ownerId!==state.user.uid){toast('Only the community owner can delete it');return}const ok=confirm(`Delete \"${c.name}\" permanently? This removes the community from Halal Chat for everyone. This cannot be undone.`);if(!ok)return;try{const cid=c.id;closeModal();if(state.messagesUnsub){state.messagesUnsub();state.messagesUnsub=null}const unsub=communityListeners.get(cid);if(unsub){unsub();communityListeners.delete(cid)}await deleteDoc(doc(db,'communities',cid));await deleteDoc(doc(db,'users',state.user.uid,'memberships',cid)).catch(()=>{});state.communities=state.communities.filter(x=>x.id!==cid);state.currentCommunity=null;renderCommunityList();nav('home');toast('Community deleted')}catch(e){console.error('deleteCommunity error',e);toast('Could not delete community: '+(e.code||e.message||'unknown error'))}}
async function redeemInviteCode(rawCode){const code=String(rawCode||'').trim().toUpperCase();if(!code){toast('Enter an invite code');return false}if(!state.user){toast('Please wait for your account to load');return false}try{const inv=await getDoc(doc(db,'inviteCodes',code));if(!inv.exists()||inv.data().active!==true){toast('This invite link is invalid or has expired');return false}const data=inv.data(),cid=data.communityId;if(!cid){toast('This invite is invalid');return false}const mref=doc(db,'communities',cid,'members',state.user.uid),uref=doc(db,'users',state.user.uid,'memberships',cid);let ms;try{ms=await getDoc(mref)}catch(e){ms=null}if(ms&&ms.exists()){history.replaceState({},document.title,location.pathname+location.hash);closeModal();await loadCommunities();openCommunity(cid);toast('You are already a member');return true}try{await setDoc(mref,{role:'member',status:'active',joinedAt:serverTimestamp(),invitedBy:data.createdBy||null,inviteCode:code})}catch(e){console.error('member create failed',e);toast('Join was blocked by Firestore rules ('+(e.code||e.message)+'). Please redeploy firestore.rules and try again.');return false}try{await setDoc(uref,{communityId:cid,role:'member',joinedAt:serverTimestamp()})}catch(e){console.error('membership record failed',e)}history.replaceState({},document.title,location.pathname+location.hash);closeModal();try{await loadCommunities();openCommunity(cid)}catch(e){console.error('post-join load failed',e)}toast('Joined private community');return true}catch(e){console.error('redeemInviteCode error',e);toast('Could not redeem this invite: '+(e.code||e.message||'unknown error'));return false}}
async function inviteModal(c){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<8;i++)code+=chars[Math.floor(Math.random()*chars.length)];const link=`${location.origin}${location.pathname}?invite=${encodeURIComponent(code)}`;try{await setDoc(doc(db,'inviteCodes',code),{communityId:c.id,communityName:c.name,createdBy:state.user.uid,createdAt:serverTimestamp(),active:true});showModal(`<h2>Invite to ${esc(c.name)}</h2><p>Share this private invite link with people you trust:</p><div class="card" style="font-size:18px;text-align:center;font-weight:800;overflow-wrap:anywhere;word-break:break-word"><span id="inviteLinkDisplay">${esc(link)}</span></div><div class="notice" style="font-size:12px">Anyone with this link can request to join this private community. Share it only with people you trust.</div><div class="modal-actions"><button class="btn" id="copyInviteLink">Copy link</button><button class="btn" id="shareInviteLink">Share</button><button class="btn primary" onclick="closeModal()">Done</button></div><p style="color:var(--muted);font-size:12px">The link opens Halal Chat and takes the recipient directly to the join screen.</p>`);$('copyInviteLink').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Invite link copied')}catch(e){toast('Copy failed — press and hold the link to copy it')}};$('shareInviteLink').onclick=async()=>{try{if(navigator.share)await navigator.share({title:`Join ${c.name} on Halal Chat`,text:`You are invited to join ${c.name} on Halal Chat.`,url:link});else{await navigator.clipboard.writeText(link);toast('Invite link copied')}}catch(e){if(e?.name!=='AbortError')toast('Could not share invite link')}}}catch(e){console.error(e);toast('Only community admins can create invites')}}
async function inviteJoinModal(prefill=''){showModal(`<h2>Join private community</h2><p>Use the invite link from a community admin, or enter the 8-character code below.</p><div class="field"><label>Invite code</label><input id="inviteCode" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(prefill)}" placeholder="e.g. 7KQ4M9TZ"></div><div class="notice" style="font-size:12px">Invite links are easier: just open the link you received and tap Join.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="redeemInvite">Join</button></div>`);$('redeemInvite').onclick=()=>redeemInviteCode($('inviteCode').value)}
async function handleInviteLink(){const code=new URLSearchParams(location.search).get('invite');if(!code||!state.user)return;try{const inv=await getDoc(doc(db,'inviteCodes',code.trim().toUpperCase()));if(!inv.exists()||inv.data().active!==true){history.replaceState({},document.title,location.pathname+location.hash);toast('This invite link is invalid or has expired');return}const d=inv.data();showModal(`<h2>Join ${esc(d.communityName||'this private community')}?</h2><p>You were invited to join this private Muslim community on Halal Chat.</p><div class="notice">Only continue if you trust the person or organization that shared this invitation.</div><div class="modal-actions"><button class="btn" id="cancelInviteLink">Cancel</button><button class="btn primary" id="acceptInviteLink">Join community</button></div>`);$('cancelInviteLink').onclick=()=>{history.replaceState({},document.title,location.pathname+location.hash);closeModal()};$('acceptInviteLink').onclick=()=>redeemInviteCode(code)}catch(e){console.error('handleInviteLink error',e);toast('Could not open this invite link')}}
async function memberManager(c){const snap=await getDocs(query(collection(db,'communities',c.id,'members'),limit(100)));showModal(`<h2>Members</h2><div id="memberRows" class="list">${snap.docs.map(d=>{const m=d.data();return `<div class="list-row"><div><b>${esc(d.id===state.user.uid?(state.profile.displayName||'You'):d.id.slice(0,8))}</b><div style="font-size:11px;color:var(--muted)">${esc(m.role||'member')}</div></div>${c.ownerId===state.user.uid&&d.id!==state.user.uid?`<button class="btn danger small" data-remove="${d.id}">Remove</button>`:''}</div>`}).join('')||'<div class="empty">No members.</div>'}</div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Done</button></div>`);document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{try{const uid=b.dataset.remove;await runTransaction(db,async tx=>{const cref=doc(db,'communities',c.id),mref=doc(db,'communities',c.id,'members',uid),cs=await tx.get(cref),ms=await tx.get(mref);if(!ms.exists())return;tx.delete(mref);tx.update(cref,{memberCount:Math.max(1,(cs.data().memberCount||1)-1),updatedAt:serverTimestamp()})});toast('Member removed');memberManager(c)}catch(e){console.error(e);toast('Could not remove member')}})}
async function leaveCommunity(c){if(c.ownerId===state.user.uid){toast('Transfer ownership before leaving');return}try{await runTransaction(db,async tx=>{const cref=doc(db,'communities',c.id),mref=doc(db,'communities',c.id,'members',state.user.uid),uref=doc(db,'users',state.user.uid,'memberships',c.id),cs=await tx.get(cref),ms=await tx.get(mref);if(!ms.exists())return;tx.delete(mref);tx.delete(uref);tx.update(cref,{memberCount:Math.max(1,(cs.data().memberCount||1)-1),updatedAt:serverTimestamp()})});closeModal();state.currentCommunity=null;await loadCommunities();nav('home');toast('Left community')}catch(e){console.error(e);toast('Could not leave community: '+(e.code||e.message||'unknown error'))}}
function communityView(){const c=state.currentCommunity;return `<div class="chat-shell"><div class="chat-head"><div><h2>${esc(c.name)} ${c.verified?'✓':''}</h2><p>${esc(c.description||'Community conversation')} · ${c.visibility==='private'?'Private':'Public'}</p></div><button class="btn small" id="communityInfoBtn">Info</button></div><div class="messages" id="messages"></div><div class="composer"><textarea id="messageInput" maxlength="4000" placeholder="Write something respectful…"></textarea><button class="btn primary" id="sendBtn">Send</button></div></div>`}
function subscribeMessages(){if(state.messagesUnsub)state.messagesUnsub();if(!state.currentCommunity)return;const q=query(collection(db,'communities',state.currentCommunity.id,'channels',state.currentChannel,'messages'),orderBy('createdAt','asc'),limit(250));state.messagesUnsub=onSnapshot(q,snap=>{const box=$('messages');if(!box)return;box.innerHTML=snap.docs.length?snap.docs.map(d=>{const m=d.data(),mine=m.uid===state.user.uid;return `<div class="msg ${mine?'me':''}"><div class="msg-top">${esc(m.displayName||'Muslim user')}<span>${fmt(m.createdAt)}</span></div><div class="msg-text">${esc(m.deleted?'Message deleted':m.text)}</div><div class="msg-actions"><button class="tiny" data-report="${d.id}">Report</button>${mine&&!m.deleted?`<button class="tiny" data-delete="${d.id}">Delete</button>`:''}</div></div>`}).join(''):`<div class="empty">No messages yet. Start with salam 👋</div>`;box.scrollTop=box.scrollHeight;document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>reportMessage(b.dataset.report));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMessage(b.dataset.delete))},()=>toast('Could not load messages'))}
async function sendMessage(){const i=$('messageInput'),text=i?.value.trim();if(!text||!state.currentCommunity)return;try{await addDoc(collection(db,'communities',state.currentCommunity.id,'channels',state.currentChannel,'messages'),{uid:state.user.uid,displayName:state.profile.displayName||'Muslim user',text,createdAt:serverTimestamp()});i.value='';i.focus()}catch(e){toast('Message failed. Check membership/rules')}}async function deleteMessage(id){try{await updateDoc(doc(db,'communities',state.currentCommunity.id,'channels',state.currentChannel,'messages',id),{deleted:true,text:'Message deleted',deletedAt:serverTimestamp()});toast('Message removed')}catch(e){console.error('deleteMessage error',e);toast('Could not delete: '+(e.code||e.message||'unknown error'))}}async function reportMessage(id){try{await addDoc(collection(db,'reports'),{type:'community_message',communityId:state.currentCommunity.id,messageId:id,reporterId:state.user.uid,status:'open',createdAt:serverTimestamp()});toast('Report submitted')}catch(e){console.error('reportMessage error',e);toast('Could not submit report: '+(e.code||e.message||'unknown error'))}}
async function loadDms(){const box=$('dmList');if(!box)return;try{const snap=await getDocs(query(collection(db,'threads'),where('memberIds','array-contains',state.user.uid),limit(50)));const docs=snap.docs.sort((a,b)=>{const ad=a.data().updatedAt?.toMillis?a.data().updatedAt.toMillis():0;const bd=b.data().updatedAt?.toMillis?b.data().updatedAt.toMillis():0;return bd-ad});box.innerHTML=docs.length?docs.map(d=>{const t=d.data(),other=(t.memberIds||[]).find(x=>x!==state.user.uid)||'';return `<button class="list-row" style="width:100%;text-align:left;border:1px solid var(--line)" data-thread="${d.id}"><div><b>${esc(t.memberNames?.[other]||'Muslim user')}</b><div style="font-size:11px;color:var(--muted)">${esc(t.lastMessage||'No messages yet')}</div></div><span class="pill">Chat</span></button>`}).join(''):`<div class="empty">No direct messages yet.</div>`;document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>openThread(b.dataset.thread))}catch(e){console.error('loadDms error',e);box.innerHTML=`<div class="notice error">Could not load messages. Please refresh and sign in again if needed.</div>`}}
async function newDmModal(){showModal(`<h2>Start a message</h2><div class="field"><label>Recipient UID</label><input id="recipientUid" maxlength="128" placeholder="Paste the person's Firebase UID"></div><div class="field"><label>Message</label><textarea id="firstMessage" maxlength="2000" rows="3"></textarea></div><div class="notice">For privacy, the first production release uses UID-based invitations rather than public people search. Add a directory only after block/report controls and privacy settings are fully tested.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="startDm">Start</button></div>`);$('startDm').onclick=async()=>{const other=$('recipientUid').value.trim(),text=$('firstMessage').value.trim();if(!other||other===state.user.uid){toast('Enter another user UID');return}try{const threadId=[state.user.uid,other].sort().join('_');await setDoc(doc(db,'threads',threadId),{memberIds:[state.user.uid,other],memberNames:{[state.user.uid]:state.profile.displayName||'Muslim user'},createdBy:state.user.uid,updatedAt:serverTimestamp(),lastMessage:text||''},{merge:true});if(text)await addDoc(collection(db,'threads',threadId,'messages'),{uid:state.user.uid,text,createdAt:serverTimestamp()});closeModal();openThread(threadId)}catch(e){toast('Could not start conversation')}}}
function messagesView(){return `<div class="content"><div class="section-head"><h2>Messages</h2><button class="btn primary" id="newDm">+ New message</button></div><div class="notice">Private conversations are scoped to the two Firebase UIDs in the thread. Blocking/reporting should be tested before inviting a large public audience.</div><div id="dmList" class="list"><div class="empty">Loading conversations…</div></div></div>`}
async function openThread(id){const t=await getDoc(doc(db,'threads',id));if(!t.exists())return;showModal(`<h2>Private message</h2><div id="threadMsgs" class="messages" style="height:360px;border-radius:14px;margin-bottom:10px"></div><div class="composer" style="padding:0;border:0"><textarea id="dmInput" maxlength="4000" placeholder="Write a private message…"></textarea><button class="btn primary" id="dmSend">Send</button></div><div class="modal-actions"><button class="btn danger" id="blockUser">Block recipient</button><button class="btn" onclick="closeModal()">Close</button></div>`);if(state.dmUnsub)state.dmUnsub();state.dmUnsub=onSnapshot(query(collection(db,'threads',id,'messages'),orderBy('createdAt','asc'),limit(200)),snap=>{$('threadMsgs').innerHTML=snap.docs.map(d=>{const m=d.data();return `<div class="msg ${m.uid===state.user.uid?'me':''}"><div class="msg-top">${m.uid===state.user.uid?'You':'Member'}<span>${fmt(m.createdAt)}</span></div><div>${esc(m.text)}</div></div>`}).join('')||'<div class="empty">Start the conversation.</div>';$('threadMsgs').scrollTop=$('threadMsgs').scrollHeight});$('dmSend').onclick=async()=>{const i=$('dmInput'),text=i.value.trim();if(!text)return;try{await addDoc(collection(db,'threads',id,'messages'),{uid:state.user.uid,text,createdAt:serverTimestamp()});await updateDoc(doc(db,'threads',id),{lastMessage:text,updatedAt:serverTimestamp()});i.value=''}catch(e){toast('Message failed')}};$('blockUser').onclick=async()=>{const other=t.data().memberIds.find(x=>x!==state.user.uid);await setDoc(doc(db,'users',state.user.uid,'blocks',other),{blockedAt:serverTimestamp()});toast('User blocked for your account')}}
function homeView(){return `<div class="content"><section class="hero"><div><h2>A trusted home for Muslim communities.</h2><p>Create private or public spaces for mosques, MSAs, Quran circles, organizations, families and Muslim groups — with messaging, events and Muslim-first tools.</p></div><div class="hero-actions"><button class="btn gold" id="heroCreate">Create community</button><button class="btn" id="heroDiscover">Discover</button></div></section><div class="grid"><div class="card"><h3>🔐 Privacy-first</h3><p>UID-based identity, member-scoped conversations, block/report foundations and security rules.</p></div><div class="card"><h3>🕌 Muslim-first</h3><p>Prayer times, Qibla, community events and a roadmap for Quran, Hadith and sourced AI tools.</p></div><div class="card"><h3>🏘️ Built for communities</h3><p>Admins can invite members, manage roles, create channels and build repeat community activity.</p></div></div><div class="section-head"><h2>My communities</h2><button class="btn" id="homeNew">+ New</button></div><div class="community-cards">${state.communities.length?state.communities.slice(0,6).map(communityCard).join(''):`<div class="card"><h3>Start the first community</h3><p>Invite a mosque, MSA, Quran group or local organization. Focused density beats an empty global feed.</p></div>`}</div><div class="section-head"><h2>Quick access</h2></div><div class="tools"><button class="tool" data-go="tools"><div>🕋</div><b>Prayer & Qibla</b><span>Location-based tools.</span></button><button class="tool" data-go="events"><div>📅</div><b>Events</b><span>Turn conversations into activity.</span></button><button class="tool" data-go="discover"><div>🔎</div><b>Discover</b><span>Find public communities.</span></button><button class="tool" data-go="messages"><div>✉️</div><b>Messages</b><span>Private conversations.</span></button></div></div>`}function communityCard(c){return `<div class="community-card"><div class="community-card-top"><div class="avatar">${initials(c.name)}</div><div><strong>${esc(c.name)} ${c.verified?'✓':''}</strong><div style="font-size:10px;color:var(--muted)">${esc(c.type||'community')} · ${c.visibility} · ${c.memberCount||1} members</div></div></div><p>${esc(c.description||'A Muslim community on Halal Chat.')}</p><div class="tags"><span class="tag">Chat</span><span class="tag">Events</span><span class="tag">Moderation</span></div><button class="btn primary" style="width:100%;margin-top:11px" data-open="${c.id}">Open community</button></div>`}
function discoverView(){const publicItems=state.communities.filter(c=>c.visibility==='public');return `<div class="content"><div class="section-head"><h2>Discover communities</h2><div style="display:flex;gap:7px"><button class="btn" id="inviteJoin">Join with invite</button><button class="btn primary" id="discoverCreate">+ Create</button></div></div><div class="notice">Public communities are discoverable. Private communities should be joined using an administrator-issued invite code.</div><div class="community-cards">${publicItems.length?publicItems.map(communityCard).join(''):`<div class="card"><h3>No public communities yet</h3><p>Create the first one and invite people who already know each other.</p></div>`}</div></div>`}
async function getLocation(){if(state.location)return state.location;if(!navigator.geolocation){toast('Location is not supported');return null}return new Promise(r=>navigator.geolocation.getCurrentPosition(p=>{state.location=p.coords;r(p.coords)},()=>r(null),{enableHighAccuracy:true,timeout:10000}))}function toolsView(){return `<div class="content"><div class="section-head"><h2>Muslim tools</h2><button class="btn" id="locBtn">Use my location</button></div><div class="tools"><button class="tool" id="prayerTool"><div>🕌</div><b>Prayer times</b><span>Daily schedule for your location.</span></button><button class="tool" id="qiblaTool"><div>🧭</div><b>Qibla</b><span>Direction from your location.</span></button><button class="tool" onclick="toast('Quran module is queued for the next release')"><div>📖</div><b>Quran</b><span>Searchable reading roadmap.</span></button><button class="tool" onclick="toast('Hadith module is queued for the next release')"><div>📚</div><b>Hadith & sources</b><span>References and attribution roadmap.</span></button></div><div id="toolResult" style="margin-top:18px"></div></div>`}async function loadPrayer(){const c=await getLocation();if(!c){toast('Allow location access to calculate prayer times');return}const box=$('toolResult');box.innerHTML='<div class="notice">Loading prayer times…</div>';try{const d=new Date(),u=`https://api.aladhan.com/v1/timings/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?latitude=${c.latitude}&longitude=${c.longitude}&method=2`,data=await fetch(u).then(r=>r.json()),t=data.data.timings;const remOn=remindersEnabled();box.innerHTML=`<div class="card"><h3>Today's prayer times</h3><div class="prayer-row">${['Fajr','Dhuhr','Asr','Maghrib','Isha'].map(n=>`<div class="prayer"><b>${n}</b><span>${esc(t[n])}</span></div>`).join('')}</div><p style="margin-top:11px">Calculated for your location. Verify settings with your local mosque when precision matters.</p><button class="btn ${remOn?'':'primary'}" id="reminderToggle" style="width:100%;margin-top:11px">${remOn?'Reminders on ✓ (tap to turn off)':'Enable prayer reminders'}</button><p style="font-size:11px;color:var(--muted);margin-top:6px">We'll notify you at each prayer time and pause the app with a reminder.</p></div>`;$('reminderToggle').onclick=async()=>{if(remindersEnabled()){disableReminders()}else{await enableReminders(c.latitude,c.longitude,t)}loadPrayer()}}catch(e){box.innerHTML='<div class="notice error">Prayer service unavailable right now.</div>'}}async function loadQibla(){const c=await getLocation();if(!c){toast('Allow location access to calculate Qibla');return}try{const d=await fetch(`https://api.aladhan.com/v1/qibla/${c.latitude}/${c.longitude}`).then(r=>r.json());$('toolResult').innerHTML=`<div class="card"><h3>Qibla direction</h3><div style="font-size:50px;text-align:center;margin:15px">🧭</div><p style="text-align:center;font-size:24px;font-weight:900">${Number(d.data.direction).toFixed(1)}°</p><p style="text-align:center">Bearing from true north.</p></div>`}catch(e){$('toolResult').innerHTML='<div class="notice error">Qibla service unavailable.</div>'}}
function eventsView(){return `<div class="content"><div class="section-head"><h2>Community events</h2><button class="btn primary" id="newEvent">+ Add event</button></div><div class="notice">Events create recurring reasons for communities to return. Add them to your community calendar once membership is established.</div><div id="eventsList" class="list"><div class="empty">Loading events…</div></div></div>`}async function loadEvents(){const box=$('eventsList');if(!box)return;try{const snap=await getDocs(query(collection(db,'events'),orderBy('startAt','asc'),limit(50)));box.innerHTML=snap.docs.length?snap.docs.map(e=>{const x=e.data();return `<div class="list-row"><div><b>${esc(x.title)}</b><div style="font-size:11px;color:var(--muted)">${fmt(x.startAt)} · ${esc(x.location||'Online')} ${x.communityId?'· Community event':''}</div></div><button class="btn small" data-rsvp="${e.id}">RSVP</button></div>`}).join(''):'<div class="empty">No events yet.</div>';document.querySelectorAll('[data-rsvp]').forEach(b=>b.onclick=()=>rsvp(b.dataset.rsvp))}catch(e){box.innerHTML='<div class="notice error">Could not load events. Deploy Firestore rules/indexes.</div>'}}async function rsvp(id){try{await setDoc(doc(db,'events',id,'attendees',state.user.uid),{uid:state.user.uid,status:'going',createdAt:serverTimestamp()});toast('RSVP saved')}catch(e){toast('Could not RSVP')}}function eventModal(){showModal(`<h2>Add an event</h2><div class="field"><label>Title</label><input id="eTitle" maxlength="80" placeholder="Quran study circle"></div><div class="field"><label>Date & time</label><input id="eDate" type="datetime-local"></div><div class="field"><label>Location</label><input id="eLocation" maxlength="100" placeholder="Community hall or online"></div><div class="field"><label>Community (optional)</label><select id="eCommunity"><option value="">General Halal Chat</option>${state.communities.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveEvent">Save</button></div>`);$('saveEvent').onclick=async()=>{const title=$('eTitle').value.trim(),dt=$('eDate').value,location=$('eLocation').value.trim(),communityId=$('eCommunity').value;if(!title||!dt){toast('Title and date are required');return}try{await addDoc(collection(db,'events'),{title,startAt:new Date(dt),location,communityId:communityId||null,createdBy:state.user.uid,createdAt:serverTimestamp()});closeModal();loadEvents();toast('Event added')}catch(e){toast('Could not add event')}}}
function render(){const main=$('main');if(state.view==='home')main.innerHTML=homeView();else if(state.view==='discover')main.innerHTML=discoverView();else if(state.view==='messages')main.innerHTML=messagesView();else if(state.view==='tools')main.innerHTML=toolsView();else if(state.view==='events')main.innerHTML=eventsView();else if(state.view==='community')main.innerHTML=communityView();renderCommunityList();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCommunity(b.dataset.open));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));$('heroCreate')?.addEventListener('click',communityModal);$('heroDiscover')?.addEventListener('click',()=>nav('discover'));$('homeNew')?.addEventListener('click',communityModal);$('discoverCreate')?.addEventListener('click',communityModal);$('inviteJoin')?.addEventListener('click',inviteJoinModal);$('sendBtn')?.addEventListener('click',sendMessage);$('messageInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('communityInfoBtn')?.addEventListener('click',communityInfo);$('newDm')?.addEventListener('click',newDmModal);$('prayerTool')?.addEventListener('click',loadPrayer);$('qiblaTool')?.addEventListener('click',loadQibla);$('locBtn')?.addEventListener('click',loadPrayer);$('newEvent')?.addEventListener('click',eventModal);if(state.view==='events')loadEvents();if(state.view==='messages')loadDms();if(state.view==='community')subscribeMessages();if(state.profile)$('profileCard').innerHTML=`<div class="avatar">${initials(state.profile.displayName)}</div><div class="meta"><strong>${esc(state.profile.displayName)}</strong><span>${state.user.isAnonymous?'Guest account':'Verified account'}</span></div>`;applyTranslations()}

function t(s){return (I18N[currentLang]&&I18N[currentLang][s])||s}
function applyTranslations(){
 document.documentElement.lang=currentLang;
 document.documentElement.dir=currentLang==='ar'?'rtl':'ltr';
 document.querySelectorAll('#app *').forEach(el=>{
   if(el.children.length===0){const raw=el.textContent.trim();if(raw&&I18N[currentLang]?.[raw])el.textContent=I18N[currentLang][raw]}
   ['placeholder','aria-label','title'].forEach(a=>{if(el.hasAttribute(a)){const raw=el.getAttribute(a);if(I18N[currentLang]?.[raw])el.setAttribute(a,I18N[currentLang][raw])}})
 });
 const ls=$('languageSelect');if(ls)ls.value=currentLang;
}
function setLanguage(lang){currentLang=I18N[lang]?lang:'en';localStorage.setItem('halalchat_lang',currentLang);render();toast('Language changed')}

// ---------- prayer reminders (notifications + in-app pause) ----------
const MAIN_PRAYERS=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
let prayerTimers=[],prayerMidnightTimer=null;
function remindersEnabled(){return localStorage.getItem('halalchat_prayerReminders')==='on'}
function cacheReminderTimings(t){localStorage.setItem('halalchat_prayerCache',JSON.stringify({date:new Date().toISOString().slice(0,10),timings:t}))}
function clearReminderTimers(){prayerTimers.forEach(id=>clearTimeout(id));prayerTimers=[];if(prayerMidnightTimer){clearTimeout(prayerMidnightTimer);prayerMidnightTimer=null}}
function scheduleReminderTimers(t){clearReminderTimers();const now=new Date();MAIN_PRAYERS.forEach(name=>{const parts=(t[name]||'').split(':');const h=Number(parts[0]),m=Number(parts[1]);if(isNaN(h)||isNaN(m))return;const at=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0);if(at>now)prayerTimers.push(setTimeout(()=>firePrayerReminder(name),at-now))});const nextRefresh=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,5,0);prayerMidnightTimer=setTimeout(async()=>{localStorage.removeItem('halalchat_prayerCache');await initReminders()},nextRefresh-now)}
function firePrayerReminder(name){if(window.Notification&&Notification.permission==='granted'){try{new Notification('Time for '+name+' prayer',{body:"It's time to pause and pray. 🕌"})}catch(e){}}showModal(`<div style="text-align:center"><div style="font-size:42px;line-height:1">🕌</div><h2>Time for ${esc(name)}</h2><p>Take a moment to pause and pray. The chat will be here when you're back.</p><button class="btn primary" style="width:100%" onclick="closeModal()">I'll pray now</button></div>`)}
async function enableReminders(lat,lon,timings){if(window.Notification&&Notification.permission!=='granted'){try{const p=await Notification.requestPermission();if(p!=='granted')toast("Notifications weren't allowed — in-app reminders will still show while the chat is open")}catch(e){}}localStorage.setItem('halalchat_prayerReminders','on');localStorage.setItem('halalchat_prayerLoc',JSON.stringify({lat,lon}));cacheReminderTimings(timings);scheduleReminderTimers(timings)}
function disableReminders(){localStorage.setItem('halalchat_prayerReminders','off');clearReminderTimers()}
async function initReminders(){if(!remindersEnabled())return;const locStr=localStorage.getItem('halalchat_prayerLoc');if(!locStr)return;const{lat,lon}=JSON.parse(locStr);let timings=null;const today=new Date().toISOString().slice(0,10);const cacheStr=localStorage.getItem('halalchat_prayerCache');if(cacheStr){const c=JSON.parse(cacheStr);if(c.date===today)timings=c.timings}if(!timings){try{const d=new Date();const u=`https://api.aladhan.com/v1/timings/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?latitude=${lat}&longitude=${lon}&method=2`;const data=await fetch(u).then(r=>r.json());timings=data.data.timings;cacheReminderTimings(timings)}catch(e){console.error('reminder refresh failed',e);return}}scheduleReminderTimers(timings)}

// ---------- $HALAL campaign tracker (admin only) ----------
const ELIGIBILITY_THRESHOLD=500;
const CAMPAIGN_START=new Date('2026-09-02T00:00:00');
const CAMPAIGN_END=new Date('2026-10-02T23:59:59');
let adminPressTimer=null;
async function openAdminPanel(){
  if(!state.user||state.user.isAnonymous){toast('Sign in with your admin account first');return}
  let ok=false;try{ok=(await getDoc(doc(db,'admins',state.user.uid))).exists()}catch(e){ok=false}
  if(!ok){toast('This account does not have admin access');return}
  showModal(`<h2>$HALAL Campaign Tracker</h2><p style="color:var(--muted);font-size:12px">Messages sent Sep 2 – Oct 2, 2026 count toward the ${ELIGIBILITY_THRESHOLD}-message threshold.</p><div id="adminBody"><div class="notice">Loading…</div></div><div class="modal-actions"><button class="btn" id="adminRefresh">Refresh</button><button class="btn" id="adminExport">Export eligible (CSV)</button><button class="btn primary" onclick="closeModal()">Close</button></div>`);
  $('adminRefresh').onclick=loadAdminStats;$('adminExport').onclick=exportEligibleCsv;
  loadAdminStats();
}
async function loadAdminStats(){
  const box=$('adminBody');if(!box)return;box.innerHTML='<div class="notice">Loading…</div>';
  try{
    const snap=await getDocs(query(collectionGroup(db,'messages'),where('createdAt','>=',CAMPAIGN_START),where('createdAt','<=',CAMPAIGN_END)));
    const counts={};snap.docs.forEach(d=>{const m=d.data();if(!m.uid)return;counts[m.uid]=(counts[m.uid]||0)+1});
    const rows=[];
    for(const uid of Object.keys(counts)){
      let name=uid.slice(0,8),createdAt=null;
      try{const u=await getDoc(doc(db,'users',uid));if(u.exists()){name=u.data().displayName||name;createdAt=u.data().createdAt||null}}catch(e){}
      const joinedDate=createdAt?.toDate?createdAt.toDate():(createdAt?new Date(createdAt):null);
      const joinedInWindow=joinedDate?(joinedDate>=CAMPAIGN_START&&joinedDate<=CAMPAIGN_END):false;
      rows.push({uid,name,count:counts[uid],createdAt,joinedInWindow,eligible:joinedInWindow&&counts[uid]>=ELIGIBILITY_THRESHOLD});
    }
    rows.sort((a,b)=>b.count-a.count);
    window._halalAdminRows=rows;
    if(!rows.length){box.innerHTML='<div class="empty">No activity in the campaign window yet.</div>';return}
    box.innerHTML=`<div class="list" style="max-height:340px;overflow:auto">${rows.map(r=>`<div class="list-row"><div><b>${esc(r.name)}</b><div style="font-size:11px;color:var(--muted)">${r.count} messages · joined ${fmt(r.createdAt)||'—'}</div></div><span class="pill" style="background:${r.eligible?'#cde7d5':'#f1ece0'};color:${r.eligible?'#255b39':'#68766f'}">${r.eligible?'Eligible':(r.joinedInWindow?(ELIGIBILITY_THRESHOLD-r.count)+' to go':'Outside window')}</span></div>`).join('')}</div><p style="font-size:11px;color:var(--muted);margin-top:8px">${rows.filter(r=>r.eligible).length} of ${rows.length} members currently eligible.</p>`;
  }catch(e){console.error('admin stats error',e);box.innerHTML='<div class="notice error">Could not load stats: '+(e.code||e.message||'unknown error')+'. If this mentions an index, open the link in the browser console and click Create index.</div>'}
}
function exportEligibleCsv(){
  const rows=window._halalAdminRows||[];const eligible=rows.filter(r=>r.eligible);
  if(!eligible.length){toast('No eligible members yet');return}
  const lines=['name,messages,joined_date',...eligible.map(r=>`${r.name},${r.count},${fmt(r.createdAt)}`)];
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='halal-chat-eligible-members.csv';a.click();URL.revokeObjectURL(url);
}
$('brandArea')?.addEventListener('pointerdown',()=>{adminPressTimer=setTimeout(openAdminPanel,1200)});
['pointerup','pointerleave','pointercancel'].forEach(evt=>$('brandArea')?.addEventListener(evt,()=>{if(adminPressTimer)clearTimeout(adminPressTimer)}));

onAuthStateChanged(auth,async user=>{stopCommunitySubscriptions();if(!user){try{await signInAnonymously(auth)}catch(e){$('main').innerHTML=`<div class="content"><div class="notice error"><b>Firebase Authentication is not enabled.</b><br><br>Enable Anonymous sign-in, Email/Password and optionally Google in Firebase Console → Authentication → Sign-in method.</div><button class="btn primary" style="margin-top:10px" onclick="authModal()">Sign in</button></div>`}return}state.user=user;try{await ensureProfile();await loadCommunities();render();initReminders();$('profileBtn').textContent=user.isAnonymous?'Create account':'Profile';if(!user.isAnonymous&&!state.profile?.onboardingComplete)setTimeout(()=>onboardingModal(false),350);if(new URLSearchParams(location.search).get('invite'))setTimeout(()=>handleInviteLink(),450)}catch(e){console.error(e);$('main').innerHTML='<div class="content"><div class="notice error">Could not initialize your account. Check Firebase configuration and Firestore rules.</div></div>'}});window.authModal=authModal;
</script></body></html>
