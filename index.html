<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#173b32" />
<title>Halal Chat — Connect. Learn. Belong.</title>
<style>
:root{
  --bg:#f5f2e9; --panel:#fffdf8; --ink:#20332c; --muted:#66756d;
  --primary:#173b32; --primary2:#24584a; --soft:#dfece6; --gold:#b68b2c;
  --line:#e3ded1; --danger:#a84f3c; --shadow:0 12px 35px rgba(30,50,42,.08);
}
*{box-sizing:border-box} html,body{margin:0;background:#dcd7c9;color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#app{max-width:1100px;min-height:100vh;margin:auto;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:900px){#app{margin:20px auto;min-height:calc(100vh - 40px);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}}
header{height:70px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:38px;height:38px;border-radius:12px;background:#e7d49b;color:var(--primary);display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand small{opacity:.75}
.header-actions{display:flex;gap:8px}.icon-btn,.pill-btn{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:9px 11px}.pill-btn{background:#e7d49b;color:var(--primary);font-weight:800}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 110px)}
aside{border-right:1px solid var(--line);padding:18px;background:#f8f5ed}
main{min-width:0;display:flex;flex-direction:column}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:none}.mobile-nav{display:flex!important}}
.mobile-nav{display:none;gap:8px;padding:9px;border-bottom:1px solid var(--line);overflow:auto}.mobile-nav button{white-space:nowrap}
.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;margin:12px 0 8px}
.nav-btn{width:100%;text-align:left;border:0;background:transparent;padding:11px;border-radius:12px;color:var(--ink);font-weight:700}.nav-btn:hover,.nav-btn.active{background:var(--soft)}
.community-list{display:flex;flex-direction:column;gap:6px}.community-item{display:flex;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:9px;border-radius:12px;width:100%}.community-item:hover,.community-item.active{background:#e9efe9}.avatar{width:34px;height:34px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-weight:900;flex:0 0 auto}.community-item .meta{min-width:0}.community-item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.community-item span{font-size:12px;color:var(--muted)}
.content{padding:24px;overflow:auto;flex:1}.hero{background:linear-gradient(135deg,#173b32,#2c6655);color:#fff;border-radius:20px;padding:25px;display:flex;justify-content:space-between;gap:18px;align-items:flex-end}.hero h2{font-size:30px;line-height:1.05;margin:0 0 8px}.hero p{margin:0;max-width:620px;opacity:.85}.hero .hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;padding:10px 14px;font-weight:750}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.gold{background:#e7d49b;border-color:#e7d49b;color:#173b32}.btn.danger{color:var(--danger);border-color:#e9cfc8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 5px 18px rgba(30,50,42,.04)}.card h3{margin:0 0 7px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.content{padding:15px}.hero{padding:20px;display:block}.hero .hero-actions{margin-top:16px}}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 12px}.section-head h2{margin:0;font-size:20px}
.community-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.community-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.community-card-top{display:flex;gap:11px;align-items:center}.community-card p{font-size:13px;color:var(--muted);min-height:38px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;background:var(--soft);border-radius:999px;padding:5px 8px;color:var(--primary)}
@media(max-width:600px){.community-cards{grid-template-columns:1fr}}
.chat-shell{height:100%;display:flex;flex-direction:column}.chat-head{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:12px}.chat-head h2{margin:0;font-size:18px}.chat-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.messages{flex:1;overflow:auto;padding:20px;background:#f8f5ed}.msg{max-width:760px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:14px;margin-bottom:10px}.msg.me{margin-left:auto;background:#e5efe9}.msg-top{font-size:12px;font-weight:800;margin-bottom:4px}.msg-top span{font-weight:400;color:var(--muted);margin-left:6px}.msg-text{white-space:pre-wrap;word-break:break-word}.msg-actions{display:flex;gap:8px;margin-top:6px}.tiny{border:0;background:transparent;color:var(--muted);font-size:11px;padding:0}.composer{display:flex;gap:8px;padding:12px;background:var(--panel);border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;min-height:44px;max-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.empty{padding:45px 15px;text-align:center;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tool{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:15px;text-align:left}.tool b{display:block;margin:7px 0 4px}.tool span{font-size:12px;color:var(--muted)}
@media(max-width:700px){.tools{grid-template-columns:1fr 1fr}}
.list{display:flex;flex-direction:column;gap:9px}.list-row{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.notice{padding:12px 14px;border-radius:12px;background:#fff7df;border:1px solid #ead8a5;color:#6e571c;font-size:13px;margin-bottom:14px}.error{background:#fff0ed;border-color:#e7c3bb;color:#7d3325}
.overlay{position:fixed;inset:0;background:rgba(16,28,24,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.show{display:flex}.modal{width:min(520px,100%);background:var(--panel);border-radius:20px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal h2{margin:0 0 16px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:11px 15px;border-radius:999px;display:none;z-index:30;font-size:13px}.toast.show{display:block}
.profile{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:11px;border-radius:14px;margin-top:14px}.profile .meta{min-width:0}.profile strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile span{font-size:11px;color:var(--muted)}
.prayer-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.prayer{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:center}.prayer b{display:block;font-size:12px}.prayer span{font-size:13px;color:var(--muted)}
@media(max-width:650px){.prayer-row{grid-template-columns:repeat(2,1fr)}}
footer{padding:15px 22px;color:var(--muted);font-size:11px;text-align:center;border-top:1px solid var(--line);background:#f8f5ed}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><div class="brand-mark">☪</div><div><h1>Halal Chat</h1><small>Connect. Learn. Belong.</small></div></div>
  <div class="header-actions"><button class="icon-btn" id="profileBtn">Profile</button><button class="pill-btn" id="upgradeBtn">Pro</button></div>
</header>
<div class="mobile-nav" id="mobileNav">
  <button class="btn" data-view="home">Home</button><button class="btn" data-view="discover">Discover</button><button class="btn" data-view="tools">Muslim Tools</button><button class="btn" data-view="messages">Messages</button>
</div>
<div class="layout">
<aside>
  <div class="nav-title">Workspace</div>
  <button class="nav-btn active" data-view="home">⌂ Home</button>
  <button class="nav-btn" data-view="discover">◎ Discover communities</button>
  <button class="nav-btn" data-view="messages">✉ Messages</button>
  <button class="nav-btn" data-view="tools">☪ Muslim tools</button>
  <button class="nav-btn" data-view="events">◷ Events</button>
  <div class="nav-title">My communities</div>
  <div id="communityList" class="community-list"></div>
  <button class="btn primary" style="width:100%;margin-top:10px" id="newCommunityBtn">+ Create community</button>
  <div class="profile" id="profileCard"><div class="avatar">?</div><div class="meta"><strong>Connecting…</strong><span>Secure sign-in</span></div></div>
</aside>
<main id="main"></main>
</div>
<footer>Built for Muslim communities • Privacy-first by design • Community data should be protected with Firestore Security Rules</footer>
</div>

<div class="overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, addDoc, getDoc, getDocs, updateDoc,
  onSnapshot, query, where, orderBy, serverTimestamp, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDvppQKyljG71-7RVe3ndF3EsadNENZ5Cw",
  authDomain: "halalchat-edece.firebaseapp.com",
  projectId: "halalchat-edece",
  storageBucket: "halalchat-edece.firebasestorage.app",
  messagingSenderId: "744135067747",
  appId: "1:744135067747:web:2f8b52ae2e3bd769a8d056",
  measurementId: "G-3JBFH8C8L5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const state = {
  user:null, profile:null, communities:[], currentCommunity:null, currentChannel:"general",
  messagesUnsub:null, view:"home", prayer:null, qibla:null
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toast(msg){ $("toast").textContent=msg; $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),2600); }
function initials(name){ return (name||"?").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase(); }
function time(ts){ if(!ts) return ""; const d=ts.toDate?ts.toDate():new Date(ts); return d.toLocaleString([], {hour:"2-digit",minute:"2-digit"}); }
function showModal(html){ $("modal").innerHTML=html; $("modalOverlay").classList.add("show"); }
function closeModal(){ $("modalOverlay").classList.remove("show"); }
$("modalOverlay").addEventListener("click",e=>{if(e.target.id==="modalOverlay")closeModal()});

function nav(view){ state.view=view; document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view===view)); render(); }

document.querySelectorAll("[data-view]").forEach(x=>x.addEventListener("click",()=>nav(x.dataset.view)));
$("profileBtn").onclick=()=>profileModal();
$("upgradeBtn").onclick=()=>upgradeModal();
$("newCommunityBtn").onclick=()=>communityModal();

function profileModal(){
  const p=state.profile||{};
  showModal(`<h2>Your profile</h2>
    <div class="field"><label>Display name</label><input id="profileName" maxlength="40" value="${esc(p.displayName||"")}"></div>
    <div class="field"><label>Short bio</label><textarea id="profileBio" maxlength="160" rows="3">${esc(p.bio||"")}</textarea></div>
    <div class="notice">Your Firebase user ID is used internally instead of your display name. Do not put private information in your public profile.</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveProfile">Save</button></div>`);
  $("saveProfile").onclick=async()=>{
    const displayName=$("profileName").value.trim()||"Muslim user";
    const bio=$("profileBio").value.trim();
    await setDoc(doc(db,"users",state.user.uid),{displayName,bio,updatedAt:serverTimestamp()},{merge:true});
    await updateProfile(state.user,{displayName});
    state.profile={...state.profile,displayName,bio}; closeModal(); render(); toast("Profile updated");
  };
}

function upgradeModal(){
  showModal(`<h2>Halal Chat Pro</h2>
    <p style="color:var(--muted)">The product is structured for paid plans, but payments are intentionally not wired into the client yet.</p>
    <div class="grid" style="grid-template-columns:1fr 1fr;margin:15px 0">
      <div class="card"><h3>Free</h3><p>Join communities, chat, DMs, basic Muslim tools and events.</p></div>
      <div class="card"><h3>Pro</h3><p>AI research tools, advanced search, premium privacy controls and extra productivity features.</p></div>
    </div>
    <div class="notice">For organizations, the stronger monetization path is Community Pro: admin tools, moderation, member management, events, analytics and verification.</div>
    <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Got it</button></div>`);
}

function communityModal(){
  showModal(`<h2>Create a community</h2>
    <div class="field"><label>Name</label><input id="cName" maxlength="60" placeholder="e.g. Abuja Muslim Students"></div>
    <div class="field"><label>Description</label><textarea id="cDesc" maxlength="240" rows="3" placeholder="What is this community for?"></textarea></div>
    <div class="field"><label>Visibility</label><select id="cVisibility"><option value="public">Public — discoverable</option><option value="private">Private — invite only</option></select></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="createCommunity">Create</button></div>`);
  $("createCommunity").onclick=async()=>{
    const name=$("cName").value.trim(), description=$("cDesc").value.trim(), visibility=$("cVisibility").value;
    if(!name){toast("Give the community a name");return}
    const ref=await addDoc(collection(db,"communities"),{
      name,description,visibility,ownerId:state.user.uid,memberCount:1,verified:false,
      createdAt:serverTimestamp()
    });
    await setDoc(doc(db,"communities",ref.id,"members",state.user.uid),{role:"owner",joinedAt:serverTimestamp()});
    await setDoc(doc(db,"communities",ref.id,"channels","general"),{name:"general",description:"Community-wide conversation"});
    closeModal(); await loadCommunities(); openCommunity(ref.id); toast("Community created");
  };
}

async function ensureProfile(){
  const ref=doc(db,"users",state.user.uid), snap=await getDoc(ref);
  if(!snap.exists()){
    const name=localStorage.getItem("halalchat_displayName") || "Muslim user";
    await setDoc(ref,{displayName:name,bio:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
  }
  const fresh=await getDoc(ref); state.profile=fresh.data();
  localStorage.setItem("halalchat_displayName",state.profile.displayName||"Muslim user");
}

async function loadCommunities(){
  const qs=await getDocs(query(collection(db,"communities"),orderBy("createdAt","desc"),limit(50)));
  state.communities=qs.docs.map(d=>({id:d.id,...d.data()}));
  renderCommunityList();
}
function renderCommunityList(){
  $("communityList").innerHTML=state.communities.length ? state.communities.slice(0,12).map(c=>
    `<button class="community-item ${state.currentCommunity?.id===c.id?"active":""}" data-cid="${c.id}">
      <div class="avatar">${initials(c.name)}</div><div class="meta"><strong>${esc(c.name)} ${c.verified?"✓":""}</strong><span>${c.visibility==="private"?"Private":"Public"} · ${c.memberCount||1} member${(c.memberCount||1)==1?"":"s"}</span></div>
    </button>`).join("") : `<div class="empty" style="padding:15px 5px">No communities yet.</div>`;
  document.querySelectorAll("[data-cid]").forEach(x=>x.onclick=()=>openCommunity(x.dataset.cid));
}

async function openCommunity(id){
  const c=state.communities.find(x=>x.id===id); if(!c)return;
  state.currentCommunity=c; state.currentChannel="general"; nav("community");
}

function communityView(){
  const c=state.currentCommunity;
  if(!c)return `<div class="content"><div class="empty">Choose a community.</div></div>`;
  return `<div class="chat-shell">
    <div class="chat-head"><div><h2>${esc(c.name)} ${c.verified?"✓":""}</h2><p>${esc(c.description||"Community conversation")} · ${c.visibility==="private"?"Private":"Public"}</p></div>
      <div><button class="btn" id="communityInfoBtn">Info</button></div></div>
    <div class="messages" id="messages"></div>
    <div class="composer"><textarea id="messageInput" placeholder="Write something respectful…"></textarea><button class="btn primary" id="sendBtn">Send</button></div>
  </div>`;
}

function subscribeMessages(){
  if(state.messagesUnsub) state.messagesUnsub();
  if(!state.currentCommunity)return;
  const q=query(collection(db,"communities",state.currentCommunity.id,"channels",state.currentChannel,"messages"),orderBy("createdAt","asc"),limit(200));
  state.messagesUnsub=onSnapshot(q,snap=>{
    const box=$("messages"); if(!box)return;
    box.innerHTML=snap.docs.length?snap.docs.map(d=>{
      const m=d.data(), mine=m.uid===state.user.uid;
      return `<div class="msg ${mine?"me":""}" data-message="${d.id}">
        <div class="msg-top">${esc(m.displayName||"Muslim user")}<span>${time(m.createdAt)}</span></div>
        <div class="msg-text">${esc(m.text)}</div>
        <div class="msg-actions"><button class="tiny report" data-id="${d.id}">Report</button>${mine?`<button class="tiny" data-delete="${d.id}">Delete</button>`:""}</div>
      </div>`;
    }).join(""):`<div class="empty">No messages yet. Start with salam 👋</div>`;
    box.scrollTop=box.scrollHeight;
    document.querySelectorAll(".report").forEach(b=>b.onclick=()=>reportMessage(b.dataset.id));
    document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteMessage(b.dataset.delete));
  },err=>{console.error(err);toast("Could not load messages. Check Firestore rules.");});
}
async function sendMessage(){
  const input=$("messageInput"), text=input.value.trim(); if(!text||!state.currentCommunity)return;
  await addDoc(collection(db,"communities",state.currentCommunity.id,"channels",state.currentChannel,"messages"),{
    uid:state.user.uid,displayName:state.profile.displayName||"Muslim user",text,createdAt:serverTimestamp()
  });
  input.value=""; input.focus();
}
async function deleteMessage(id){
  if(!state.currentCommunity)return;
  await updateDoc(doc(db,"communities",state.currentCommunity.id,"channels",state.currentChannel,"messages",id),{deleted:true,text:"Message deleted"});
  toast("Message removed");
}
async function reportMessage(id){
  if(!state.currentCommunity)return;
  await addDoc(collection(db,"reports"),{type:"message",communityId:state.currentCommunity.id,messageId:id,reporterId:state.user.uid,createdAt:serverTimestamp()});
  toast("Report submitted to moderators");
}
function communityInfo(){
  const c=state.currentCommunity;
  showModal(`<h2>${esc(c.name)}</h2><p style="color:var(--muted)">${esc(c.description||"No description")}</p>
    <div class="list"><div class="list-row"><span>Visibility</span><b>${c.visibility}</b></div><div class="list-row"><span>Members</span><b>${c.memberCount||1}</b></div><div class="list-row"><span>Verified organization</span><b>${c.verified?"Yes":"Not yet"}</b></div></div>
    <div class="notice" style="margin-top:14px">Owner/admin verification should be performed server-side. Never trust a client-side role flag for moderation or billing.</div>
    <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Close</button></div>`);
}

function homeView(){
 return `<div class="content">
   <section class="hero"><div><h2>One trusted home for your Muslim community.</h2><p>Create or join focused communities for mosques, student groups, Quran circles, professionals, families and local networks.</p></div>
   <div class="hero-actions"><button class="btn gold" id="heroCreate">Create community</button><button class="btn" id="heroDiscover">Discover</button></div></section>
   <div class="grid">
    <div class="card"><h3>💬 Community chat</h3><p>Real-time channels with identity, reporting and moderation foundations.</p></div>
    <div class="card"><h3>🛡️ Privacy first</h3><p>User records are keyed by Firebase UID rather than display names.</p></div>
    <div class="card"><h3>🕌 Muslim tools</h3><p>Prayer times, Qibla and a foundation for Quran, Hadith and Islamic resources.</p></div>
   </div>
   <div class="section-head"><h2>My communities</h2><button class="btn" id="homeNew">+ New</button></div>
   <div class="community-cards">${state.communities.length?state.communities.slice(0,6).map(c=>communityCard(c)).join(""):`<div class="card"><h3>Start with one real community</h3><p>Invite a mosque, MSA, Quran circle or local group. Density is more important than adding dozens of features.</p></div>`}</div>
   <div class="section-head"><h2>Quick access</h2></div>
   <div class="tools"><button class="tool" data-go="tools"><div>🕋</div><b>Prayer & Qibla</b><span>Find prayer times and direction.</span></button><button class="tool" data-go="events"><div>📅</div><b>Events</b><span>Build community activity around events.</span></button><button class="tool" data-go="discover"><div>🔎</div><b>Discover</b><span>Find communities that fit you.</span></button><button class="tool" data-go="messages"><div>✉️</div><b>Messages</b><span>Direct messaging foundation.</span></button></div>
 </div>`;
}
function communityCard(c){
 return `<div class="community-card"><div class="community-card-top"><div class="avatar">${initials(c.name)}</div><div><strong>${esc(c.name)} ${c.verified?"✓":""}</strong><div style="font-size:11px;color:var(--muted)">${c.visibility} · ${c.memberCount||1} members</div></div></div><p>${esc(c.description||"A Muslim community on Halal Chat.")}</p><div class="tags"><span class="tag">Chat</span><span class="tag">Events</span><span class="tag">Moderation</span></div><button class="btn primary" style="width:100%;margin-top:12px" data-open="${c.id}">Open community</button></div>`;
}

function discoverView(){
 const items=state.communities.filter(c=>c.visibility==="public");
 return `<div class="content"><div class="section-head"><h2>Discover communities</h2><button class="btn primary" id="discoverCreate">+ Create</button></div>
 <div class="notice">Launch with a focused network first. Examples: mosque communities, university Muslim associations, Quran study groups, professional networks and local sisters/brothers groups.</div>
 <div class="community-cards">${items.length?items.map(c=>communityCard(c)).join(""):`<div class="card"><h3>No public communities yet</h3><p>Create the first one and invite people who already know each other.</p></div>`}</div></div>`;
}
function toolsView(){
 return `<div class="content"><div class="section-head"><h2>Muslim tools</h2><button class="btn" id="locBtn">Use my location</button></div>
 <div class="tools"><button class="tool" id="prayerTool"><div>🕌</div><b>Prayer times</b><span>Location-based daily schedule.</span></button><button class="tool" id="qiblaTool"><div>🧭</div><b>Qibla</b><span>Direction from your current location.</span></button><button class="tool" onclick="toast('Quran module is planned for the next release')"><div>📖</div><b>Quran</b><span>Planned: searchable reading experience.</span></button><button class="tool" onclick="toast('Hadith module is planned for the next release')"><div>📚</div><b>Hadith & sources</b><span>Planned: references and attribution.</span></button></div>
 <div id="toolResult" style="margin-top:18px"></div>
 </div>`;
}
async function getLocation(){
 if(!navigator.geolocation){toast("Location is not supported");return null}
 return new Promise(resolve=>navigator.geolocation.getCurrentPosition(p=>resolve(p.coords),()=>resolve(null),{enableHighAccuracy:true,timeout:10000}));
}
async function loadPrayer(){
 const coords=await getLocation(); if(!coords){toast("Allow location access to calculate prayer times");return}
 $("toolResult").innerHTML='<div class="notice">Loading prayer times…</div>';
 try{
   const d=new Date(), url=`https://api.aladhan.com/v1/timings/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?latitude=${coords.latitude}&longitude=${coords.longitude}&method=2`;
   const data=await fetch(url).then(r=>r.json()); const t=data.data.timings;
   const names=["Fajr","Dhuhr","Asr","Maghrib","Isha"];
   $("toolResult").innerHTML=`<div class="card"><h3>Today's prayer times</h3><div class="prayer-row">${names.map(n=>`<div class="prayer"><b>${n}</b><span>${esc(t[n])}</span></div>`).join("")}</div><p style="margin-top:12px">Calculated for your current location. Verify the method/settings with your local mosque when precision matters.</p></div>`;
 }catch(e){$("toolResult").innerHTML='<div class="notice error">Prayer service unavailable right now.</div>'}
}
async function loadQibla(){
 const coords=await getLocation(); if(!coords){toast("Allow location access to calculate Qibla");return}
 try{
   const data=await fetch(`https://api.aladhan.com/v1/qibla/${coords.latitude}/${coords.longitude}`).then(r=>r.json());
   const direction=data.data.direction;
   $("toolResult").innerHTML=`<div class="card"><h3>Qibla direction</h3><div style="font-size:48px;text-align:center;margin:15px">🧭</div><p style="text-align:center;font-size:24px;font-weight:800">${Number(direction).toFixed(1)}°</p><p style="text-align:center">Bearing from true north.</p></div>`;
 }catch(e){$("toolResult").innerHTML='<div class="notice error">Qibla service unavailable right now.</div>'}
}
function eventsView(){
 return `<div class="content"><div class="section-head"><h2>Community events</h2><button class="btn primary" id="newEvent">+ Add event</button></div>
 <div class="notice">Events are a key retention feature: use them to turn a chat group into an active community.</div><div id="eventsList" class="list"><div class="empty">Loading events…</div></div></div>`;
}
async function loadEvents(){
 const box=$("eventsList"); if(!box)return;
 const snap=await getDocs(query(collection(db,"events"),orderBy("startAt","asc"),limit(50)));
 const events=snap.docs.map(d=>({id:d.id,...d.data()}));
 box.innerHTML=events.length?events.map(e=>`<div class="list-row"><div><b>${esc(e.title)}</b><div style="font-size:12px;color:var(--muted)">${e.startAt?.toDate?e.startAt.toDate().toLocaleString(): "Date to be confirmed"} · ${esc(e.location||"Online")}</div></div><button class="btn" data-rsvp="${e.id}">RSVP</button></div>`).join(""):`<div class="empty">No events yet. Create one for your community.</div>`;
 document.querySelectorAll("[data-rsvp]").forEach(b=>b.onclick=()=>toast("RSVP UI is ready; attendance storage can be connected next."));
}
function eventModal(){
 showModal(`<h2>Add an event</h2><div class="field"><label>Title</label><input id="eTitle" maxlength="80" placeholder="Quran study circle"></div><div class="field"><label>Date & time</label><input id="eDate" type="datetime-local"></div><div class="field"><label>Location</label><input id="eLocation" maxlength="100" placeholder="Community hall or online"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveEvent">Save</button></div>`);
 $("saveEvent").onclick=async()=>{const title=$("eTitle").value.trim(), dt=$("eDate").value, location=$("eLocation").value.trim();if(!title||!dt){toast("Title and date are required");return}await addDoc(collection(db,"events"),{title,startAt:new Date(dt),location,createdBy:state.user.uid,createdAt:serverTimestamp()});closeModal();loadEvents();toast("Event added")};
}
function messagesView(){
 return `<div class="content"><div class="section-head"><h2>Messages</h2></div><div class="notice">Direct messages are the next private-network layer. The current prototype focuses on secure community identity and channels first.</div><div class="card"><h3>DM foundation</h3><p>Use Firebase UID-based threads for one-to-one conversations. Add block/report controls before public launch.</p><button class="btn primary" style="margin-top:12px" onclick="toast('DM composer will be enabled after community membership rules are deployed')">New message</button></div></div>`;
}

function render(){
 const main=$("main");
 if(state.view==="home") main.innerHTML=homeView();
 else if(state.view==="discover") main.innerHTML=discoverView();
 else if(state.view==="tools") main.innerHTML=toolsView();
 else if(state.view==="events") main.innerHTML=eventsView();
 else if(state.view==="messages") main.innerHTML=messagesView();
 else if(state.view==="community"){main.innerHTML=communityView(); setTimeout(subscribeMessages,0);}
 renderCommunityList();
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openCommunity(b.dataset.open));
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>nav(b.dataset.go));
 $("heroCreate")?.addEventListener("click",communityModal); $("homeNew")?.addEventListener("click",communityModal); $("discoverCreate")?.addEventListener("click",communityModal);
 $("sendBtn")?.addEventListener("click",sendMessage); $("messageInput")?.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
 $("communityInfoBtn")?.addEventListener("click",communityInfo);
 $("prayerTool")?.addEventListener("click",loadPrayer); $("qiblaTool")?.addEventListener("click",loadQibla); $("locBtn")?.addEventListener("click",loadPrayer);
 $("newEvent")?.addEventListener("click",eventModal); if(state.view==="events")loadEvents();
 if(state.profile){$("profileCard").innerHTML=`<div class="avatar">${initials(state.profile.displayName)}</div><div class="meta"><strong>${esc(state.profile.displayName)}</strong><span>Firebase UID account</span></div>`}
}

onAuthStateChanged(auth,async user=>{
 if(user){state.user=user; await ensureProfile(); await loadCommunities(); render(); return}
 try{
   await signInAnonymously(auth);
 }catch(e){
   console.error(e);
   $("main").innerHTML=`<div class="content"><div class="notice error"><b>Firebase Authentication needs one console setting.</b><br><br>Enable <b>Anonymous</b> sign-in in Firebase Console → Authentication → Sign-in method, then reload this page.</div></div>`;
 }
});

window.closeModal=closeModal;
window.toast=toast;
</script>
</body>
</html>
