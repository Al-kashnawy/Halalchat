function authModal(){showModal(`<div style="text-align:center;padding:6px 4px 2px"><div class="avatar" style="margin:0 auto 12px;width:52px;height:52px;font-size:23px;background:var(--gold)">☪</div><h2 style="margin-bottom:7px">Welcome to Halal Chat</h2><p style="margin:0;color:var(--muted);font-size:13px">A private, respectful space for Muslim communities.</p></div><div class="tabs" style="margin-top:18px"><button class="tab active" id="loginTab">Sign in</button><button class="tab" id="signupTab">Create account</button></div><div id="authForm" style="margin-top:15px"></div>`);let mode="login";const draw=()=>{$("authForm").innerHTML=mode==='login'?`<div class="field"><label>Email address</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="authPass" type="password" autocomplete="current-password" placeholder="Your password"></div><div style="text-align:right;margin:-3px 0 12px"><button class="tiny" id="forgotBtn">Forgot password?</button></div><button class="btn primary" id="authSubmit" style="width:100%">Sign in</button><div style="text-align:center;margin:14px 0;color:var(--muted);font-size:12px">or</div><button class="btn" id="googleBtn" style="width:100%">Continue with Google</button>`:`<div class="field"><label>Full name / display name</label><input id="authName" maxlength="40" autocomplete="name" placeholder="How should people know you?"></div><div class="field"><label>Email address</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="authPass" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><div class="notice" style="margin-top:5px">Your account keeps your profile, communities and conversations connected to you. We recommend using an email you can access.</div><button class="btn primary" id="authSubmit" style="width:100%">Create my account</button><div style="text-align:center;margin:14px 0;color:var(--muted);font-size:12px">or</div><button class="btn" id="googleBtn" style="width:100%">Continue with Google</button>`;$('authSubmit').onclick=async()=>{const e=$('authEmail').value.trim(),pw=$('authPass').value;if(!e||!pw){toast('Enter your email and password');return}try{if(mode==='login'){await signInWithEmailAndPassword(auth,e,pw);closeModal()}else{const name=$('authName').value.trim();if(!name){toast('Add a display name');return}const cred=await createUserWithEmailAndPassword(auth,e,pw);await updateProfile(cred.user,{displayName:name});await setDoc(doc(db,'users',cred.user.uid),{displayName:name,bio:'',location:'',interests:[],email:e,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),onboardingComplete:false},{merge:true});try{await sendEmailVerification(cred.user)}catch(_){}closeModal();setTimeout(()=>onboardingModal(true),250)}}catch(err){const code=err.code||'';const map={'auth/email-already-in-use':'An account with this email already exists. Try Sign in.','auth/invalid-email':'That email address is not valid.','auth/weak-password':'Use a stronger password (6+ characters).','auth/invalid-credential':'Email or password is incorrect.','auth/user-not-found':'No account was found with that email.','auth/wrong-password':'Email or password is incorrect.','auth/too-many-requests':'Too many attempts. Please wait and try again.'};toast(map[code]||'Authentication failed')}};$('googleBtn').onclick=async()=>{try{const cred=await signInWithPopup(auth,new GoogleAuthProvider());await ensureProfile();closeModal();if(!state.profile?.onboardingComplete)setTimeout(()=>onboardingModal(false),250)}catch(err){toast(err.code?.includes('popup')?'Google sign-in was cancelled':'Google sign-in unavailable')}};if($('forgotBtn'))$('forgotBtn').onclick=async()=>{const e=$('authEmail').value.trim();if(!e){toast('Enter your email first');return}try{await sendPasswordResetEmail(auth,e);toast('Password reset emai function onboardingModal(showWelcome){const p=state.profile||{};showModal(`<div style="text-align:center"><div class="avatar" style="margin:0 auto 12px;width:52px;height:52px;font-size:23px;background:var(--gold)">☪</div><h2>${showWelcome?'Welcome — let’s set up your profile':'Finish your profile'}</h2><p style="color:var(--muted);font-size:13px">A few details help your community know who you are. You can change them later.</p></div><div class="field"><label>Display name</label><input id="onName" maxlength="40" value="${esc(p.displayName||state.user?.displayName||'')}" placeholder="Your name"></div><div class="field"><label>Bio <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea id="onBio" maxlength="160" rows="3" placeholder="Tell your community a little about yourself">${esc(p.bio||'')}</textarea></div><div class="field"><label>City / country <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="onPlace" maxlength="80" value="${esc(p.location||'')}" placeholder="e.g. Abuja, Nigeria"></div><div class="field"><label>Interests <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="onInterests" maxlength="160" value="${esc((p.interests||[]).join(', '))}" placeholder="Quran, students, business, volunteering"></div><div class="modal-actions"><button class="btn" id="skipOn">${showWelcome?'Skip for now':'Cancel'}</button><button class="btn primary" id="saveOn">Continue</button></div>`);$('skipOn').onclick=()=>{closeModal();if(showWelcome)toast('You can finish your profile anytime from Profile')};$('saveOn').onclick=async()=>{const displayName=$('onName').value.trim()||'Muslim user',bio=$('onBio').value.trim(),location=$('onPlace').value.trim(),interests=$('onInterests').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,10);try{await setDoc(doc(db,'users',state.user.uid),{displayName,bio,location,interests,onboardingComplete:true,updatedAt:serverTimestamp()},{merge:true});a let communityListeners=new Map(),communityRootListeners=[];
function stopCommunitySubscriptions(){communityRootListeners.forEach(u=>u&&u());communityRootListeners=[];communityListeners.forEach(u=>u&&u());communityListeners.clear()}
function sortCommunities(list){return list.sort((a,b)=>{const at=a.createdAt?.toMillis?a.createdAt.toMillis():(a.createdAt?.seconds||0)*1000;const bt=b.createdAt?.toMillis?b.createdAt.toMillis():(b.createdAt?.seconds||0)*1000;return bt-at})}
function upsertCommunityDoc(d){if(!d.exists()){const unsub=communityListeners.get(d.id);if(unsub)unsub();communityListeners.delete(d.id);state.communities=state.communities.filter(c=>c.id!==d.id);renderCommunityList();return}const c={id:d.id,...d.data()};const idx=state.communities.findIndex(x=>x.id===c.id);if(idx>=0)state.communities[idx]=c;else state.communities.push(c);sortCommunities(state.communities);renderCommunityList();if(state.currentCommunity?.id===c.id){state.currentCommunity=c;const title=$('communityTitle'),meta=$('communityMeta');if(title)title.textContent=c.name;if(meta)meta.textContent=`${c.memberCount||0} members • ${c.visibility==='private'?'Private':'Public'}`} }
function ensureCommunityListener(id){if(communityListeners.has(id))return;const unsub=onSnapshot(doc(db,'communities',id),d=>upsertCommunityDoc(d),e=>{console.error('community listener',id,e);if(e.code!=='permission-denied')toast('A community could not be updated in real time')});communityListeners.set(id,unsub)}
function subscribeCommunities(){stopCommunitySubscriptions();if(!state.user)return;const mergeSnapshot=snap=>{snap.docs.forEach(d=>ensureCommunityListener(d.id));const ids=new Set(snap.docs.map(d=>d.id));if(snap.metadata.fromCache)return;state.communities=state.communities.filter(c=>{const isPublic=c.visibility==='public';const isOwned=c.ownerId===state.user.uid;return isPublic||isOwned||ids.has(c.id)});renderCommunityList()};const publicQ=query(collection(db,'communities'),where('visibility','==','public'),limit(100));const ownQ=query(collection(db,'communities'),where('ownerId','==',state.user.uid),limit(100));const memberQ=query(collection(db,'users',state.user.uid,'memberships'),limit(100));communityRootListeners.push(onSnapshot(publicQ,mergeSnapshot,e=>console.error('public communities listener',e)));communityRootListeners.push(onSnapshot(ownQ,mergeSnapshot,e=>console.error('owned communities listener',e)));communityRootListeners.push(onSnapshot(memberQ,snap=>{const ids=new Set(snap.docs.map(d=>d.id));snap.docs.forEach(d=>ensureCommunityListener(d.id));state.communities=state.communities.filter(c=>c.visibility==='public'||c.ownerId===state.user.uid||ids.has(c.id));renderCommunityList()},e=>console.error('membership listener',e)))}
async function loadCommunities(){try{const publicSnap=await getDocs(query(collection(db,'communities'),where('visibility','==','public'),limit(100)));const own=await getDocs(query(collection(db,'communities'),where('ownerId','==',state.user.uid),limit(100)));const memberships=await getDocs(query(collection(db,'users',state.user.uid,'memberships'),limit(100)));const map=new Map();publicSnap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));own.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));for(const m of memberships.docs){const d=await getDoc(doc(db,'communities',m.id));if(d.exists())map.set(d.id,{id:d.id,...d.data()})}state.communities=sortCommunities([...map.values()]);renderCommunityList();subscribeCommunities()}catch(e){console.error('loadCommunities error',e);toast('Could not load communities: '+(e.code||e.message||'unknown error'))}}
function renderCommunityList(){$('communityList').innerHTML=state.communities.length?state.communities.slice(0,14).map(c=>`<button class="community-item ${state.currentCommunity?.id===c.id?'active':''}" data-cid="${c.id}"><div class="avatar">${initials(c.name)}</div><div class="meta"><strong>${esc(c.name)} ${c.verified?'✓':''}</strong><span>${c.visibility==='private'?'Private':'Public'} · ${c.memberCount||1} members</span></div></button>`).join(''):`<div class="empty" style="padding:12px 4px">No communities yet.</div>`;document.querySelectorAll('[data-cid]').forEach(x=>x.onclick=()=>openCommunity(x.dataset.cid))}
async function joinCommunity(id){const c=state.communities.find(x=>x.id===id);if(!c)return;try{const cref=doc(db,'communities',id),mref=doc(db,'communities',id,'members',state.user.uid),uref=doc(db,'users',state.user.uid,'memberships',id);await runTransaction(db,async tx=>{const cs=await tx.get(cref),ms=await tx.get(mref);if(ms.exists())return;const oldCount=cs.data().memberCount||0;tx.set(mref,{role:'member',status:'active',joinedAt:serverTimestamp()});tx.set(uref,{communityId:id,role:'member',joinedAt:serverTimestamp()});tx.update(cref,{memberCount:oldCount+1,updatedAt:serverTimestamp()})});await loadCommunities();openCommunity(id);toast('Joined community')}catch(e){console.error(e);toast('Could not join this community')}}
async function openCommunity(id){const c=state.communities.find(x=>x.id===id);if(!c)return;const member=await getDoc(doc(db,'communities',id,'members',state.user.uid));if(!member.exists()&&c.ownerId!==state.user.uid){if(c.visibility==='public'){showModal(`<h2>${esc(c.name)}</h2><p>${esc(c.description||'Join this Muslim community.')}</p><div class="notice">This is a public community. Join to participate in its channels.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="joinNow">Join community</button></div>`);$('joinNow').onclick=()=>{closeModal();joinCommunity(id)};return}toast('This community is private. Use an invite link/code from an administrator.');return}state.currentCommunity=c;state.currentChannel='general';nav('community')}
function communityInfo(){const c=state.currentCommunity;if(!c)return;showModal(`<h2>${esc(c.name)} ${c.verified?'✓':''}</h2><p style="color:var(--muted)">${esc(c.description||'')}</p><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h3>${c.memberCount||1}</h3><p>Members</p></div><div class="card"><h3>${c.visibility==='private'?'Private':'Public'}</h3><p>Community type</p></div></div><div class="section-head"><h2>Admin tools</h2></div><div class="tabs"><button class="tab" id="inviteBtn">Invite members</button><button class="tab" id="manageBtn">Manage members</button><button class="tab" id="leaveBtn">Leave</button></div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Done</button></div>`);$('inviteBtn').onclick=()=>inviteModal(c);$('manageBtn').onclick=()=>memberManager(c);$('leaveBtn').onclick=()=>leaveCommunity(c)}
async function inviteModal(c){const code=c.id+'.'+crypto.randomUUID().replaceAll('-','').slice(0,16);try{await setDoc(doc(db,'communities',c.id,'invites',code),{createdBy:state.user.uid,createdAt:serverTimestamp(),active:true});showModal(`<h2>Invite to ${esc(c.name)}</h2><p>Share this invite code with people you trust:</p><div class="card" style="font-size:22px;text-align:center;font-weight:900;letter-spacing:.12em">${code}</div><p style="color:var(--muted);font-size:12px">On the receiving device, use Join with invite code from Discover.</p><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Done</button></div>`)}catch(e){toast('Only community admins can create invites')}}
async function inviteJoinModal(){showModal(`<h2>Join with invite code</h2><div class="field"><label>Invite code</label><input id="inviteCode" maxlength="24" placeholder="Paste code"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="redeemInvite">Join</button></div>`);$('redeemInvite').onclick=async()=>{const code=$('inviteCode').value.trim();if(!code)return;try{const cid=code.split('.')[0];if(!cid){toast('Invalid invite code');return}const inv=await getDoc(doc(db,'communities',cid,'invites',code));if(!inv.exists()||inv.data().active!==true){toast('Invite not found or inactive');return}const cref=doc(db,'communities',cid),mref=doc(db,'communities',cid,'members',state.user.uid),uref=doc(db,'users',state.user.uid,'memberships',cid);await runTransaction(db,async tx=>{const cs=await tx.get(cref),ms=await tx.get(mref);if(!cs.exists())throw new Error('community_missing');if(ms.exists())return;const oldCount=cs.data().memberCount||0;tx.set(mref,{role:'member',status:'active',joinedAt:serverTimestamp(),invitedBy:inv.data().createdBy});tx.set(uref,{communityId:cid,role:'member',joinedAt:serverTimestamp()});tx.update(cref,{memberCount:oldCount+1,updatedAt:serverTimestamp()})});closeModal();await loadCommunities();openCommunity(cid);toast('Joined private community')}catch(e){console.error(e);toast('Could not redeem invite')}}}
async function memberManager(c){const snap=await getDocs(query(collection(db,'communities',c.id,'members'),limit(100)));showModal(`<h2>Members</h2><div id="memberRows" class="list">${snap.docs.map(d=>{const m=d.data();return `<div class="list-row"><div><b>${esc(d.id===state.user.uid?(state.profile.displayName||'You'):d.id.slice(0,8))}</b><div style="font-size:11px;color:var(--muted)">${esc(m.role||'member')}</div></div>${c.ownerId===state.user.uid&&d.id!==state.user.uid?`<button class="btn danger small" data-remove="${d.id}">Remove</button>`:''}</div>`}).join('')||'<div class="empty">No members.</div>'}</div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Done</button></div>`);document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{try{await deleteDoc(doc(db,'communities',c.id,'members',b.dataset.remove));await deleteDoc(doc(db,'users',b.dataset.remove,'memberships',c.id));await updateDoc(doc(db,'communities',c.id),{memberCount:Math.max(1,(c.memberCount||1)-1)});toast('Member removed');memberManager(c)}catch(e){toast('Could not remove member')}})}
async function leaveCommunity(c){if(c.ownerId===state.user.uid){toast('Transfer ownership before leaving');return}try{await deleteDoc(doc(db,'communities',c.id,'members',state.user.uid));await deleteDoc(doc(db,'users',state.user.uid,'memberships',c.id));await updateDoc(doc(db,'communities',c.id),{memberCount:Math.max(1,(c.memberCount||1)-1)});closeModal();state.currentCommunity=null;await loadCommunities();nav('home');toast('Left community')}catch(e){toast('Could not leave community')}}
function communityView(){const c=state.currentCommunity;return `<div class="chat-shell"><div class="chat-head"><div><h2>${esc(c.name)} ${c.verified?'✓':''}</h2><p>${esc(c.description||'Community conversation')} · ${c.visibility==='private'?'Private':'Public'}</p></div><button class="btn small" id="communityInfoBtn">Info</button></div><div class="messages" id="messages"></div><div class="composer"><textarea id="messageInput" maxlength="4000" placeholder="Write something respectful…"></textarea><button class="btn primary" id="sendBtn">Send</button></div></div>`}
function subscribeMessages(){if(state.messagesUnsub)state.messagesUnsub();if(!state.currentCommunity)return;const q=query(collection(db,'communities',state.currentCommunity.id,'channels',state.currentChannel,'messages'),orderBy('createdAt','asc'),limit(250));state.messagesUnsub=onSnapshot(q,snap=>{const box=$('messages');if(!box)return;box.innerHTML=snap.docs.length?snap.docs.map(d=>{const m=d.data(),mine=m.uid===state.user.uid;return `<div class="msg ${mine?'me':''}"><div class="msg-top">${esc(m.displayName||'Muslim user')}<span>${fmt(m.createdAt)}</span></div><div class="msg-text">${esc(m.deleted?'Message deleted':m.text)}</div><div class="msg-actions"><button class="tiny" data-report="${d.id}">Report</button>${mine&&!m.deleted?`<button class="tiny" data-delete="${d.id}">Delete</button>`:''}</div></div>`}).join(''):`<div class="empty">No messages yet. Start with salam 👋</div>`;box.scrollTop=box.scrollHeight;document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>reportMessage(b.dataset.id));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMessage(b.dataset.id))},()=>toast('Could not load messages'))}
async function sendMessage(){const i=$('messageInput'),text=i?.value.trim();if(!text||!state.currentCommunity)return;try{await addDoc(collection(db,'communities',state.currentCommunity.id,'channels',state.currentChannel,'messages'),{uid:state.user.uid,displayName:state.profile.displayName||'Muslim user',text,createdAt:serverTimestamp()});i.value='';i.focus()}catch(e){toast('Message failed. Check membership/rules')}}async function deleteMessage(id){try{await updateDoc(doc(db,'communities',state.currentCommunity.id,'channels',state.currentChannel,'messages',id),{deleted:true,text:'Message deleted',deletedAt:serverTimestamp()});toast('Message removed')}catch(e){toast('Could not delete message')}}async function reportMessage(id){try{await addDoc(collection(db,'reports'),{type:'community_message',communityId:state.currentCommunity.id,messageId:id,reporterId:state.user.uid,status:'open',createdAt:serverTimestamp()});toast('Report submitted')}catch(e){toast('Could not submit report')}}
async function loadDms(){const box=$('dmList');if(!box)return;try{const snap=await getDocs(query(collection(db,'threads'),where('memberIds','array-contains',state.user.uid),orderBy('updatedAt','desc'),limit(50)));box.innerHTML=snap.docs.length?snap.docs.map(d=>{const t=d.data();const other=t.memberIds.find(x=>x!==state.user.uid)||'';return `<button class="list-row" style="width:100%;text-align:left;border:1px solid var(--line)" data-thread="${d.id}"><div><b>${esc(t.memberNames?.[other]||'Muslim user')}</b><div style="font-size:11px;color:var(--muted)">${esc(t.lastMessage||'No messages yet')}</div></div><span class="pill">Chat</span></button>`}).join(''):`<div class="empty">No direct messages yet.</div>`;document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>openThread(b.dataset.thread))}catch(e){box.innerHTML='<div class="notice error">Could not load messages. Your Firestore rules/index may need deployment.</div>'}}
async function newDmModal(){showModal(`<h2>Start a message</h2><div class="field"><label>Recipient UID</label><input id="recipientUid" maxlength="128" placeholder="Paste the person's Firebase UID"></div><div class="field"><label>Message</label><textarea id="firstMessage" maxlength="2000" rows="3"></textarea></div><div class="notice">For privacy, the first production release uses UID-based invitations rather than public people search. Add a directory only after block/report controls and privacy settings are fully tested.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="startDm">Start</button></div>`);$('startDm').onclick=async()=>{const other=$('recipientUid').value.trim(),text=$('firstMessage').value.trim();if(!other||other===state.user.uid){toast('Enter another user UID');return}try{const threadId=[state.user.uid,other].sort().join('_');await setDoc(doc(db,'threads',threadId),{memberIds:[state.user.uid,other],memberNames:{[state.user.uid]:state.profile.displayName||'Muslim user'},createdBy:state.user.uid,updatedAt:serverTimestamp(),lastMessage:text||''},{merge:true});if(text)await addDoc(collection(db,'threads',threadId,'messages'),{uid:state.user.uid,text,createdAt:serverTimestamp()});closeModal();openThread(threadId)}catch(e){toast('Could not start conversation')}}}
function messagesView(){return `<div class="content"><div class="section-head"><h2>Messages</h2><button class="btn primary" id="newDm">+ New message</button></div><div class="notice">Private conversations are scoped to the two Firebase UIDs in the thread. Blocking/reporting should be tested before inviting a large public audience.</div><div id="dmList" class="list"><div class="empty">Loading conversations…</div></div></div>`}
async function openThread(id){const t=await getDoc(doc(db,'threads',id));if(!t.exists())return;showModal(`<h2>Private message</h2><div id="threadMsgs" class="messages" style="height:360px;border-radius:14px;margin-bottom:10px"></div><div class="composer" style="padding:0;border:0"><textarea id="dmInput" maxlength="4000" placeholder="Write a private message…"></textarea><button class="btn primary" id="dmSend">Send</button></div><div class="modal-actions"><button class="btn danger" id="blockUser">Block recipient</button><button class="btn" onclick="closeModal()">Close</button></div>`);if(state.dmUnsub)state.dmUnsub();state.dmUnsub=onSnapshot(query(collection(db,'threads',id,'messages'),orderBy('createdAt','asc'),limit(200)),snap=>{$('threadMsgs').innerHTML=snap.docs.map(d=>{const m=d.data();return `<div class="msg ${m.uid===state.user.uid?'me':''}"><div class="msg-top">${m.uid===state.user.uid?'You':'Member'}<span>${fmt(m.createdAt)}</span></div><div>${esc(m.text)}</div></div>`}).join('')||'<div class="empty">Start the conversation.</div>';$('threadMsgs').scrollTop=$('threadMsgs').scrollHeight});$('dmSend').onclick=async()=>{const i=$('dmInput'),text=i.value.trim();if(!text)return;try{await addDoc(collection(db,'threads',id,'messages'),{uid:state.user.uid,text,createdAt:serverTimestamp()});await updateDoc(doc(db,'threads',id),{lastMessage:text,updatedAt:serverTimestamp()});i.value=''}catch(e){toast('Message failed')}};$('blockUser').onclick=async()=>{const other=t.data().memberIds.find(x=>x!==state.user.uid);await setDoc(doc(db,'users',state.user.uid,'blocks',other),{blockedAt:serverTimestamp()});toast('User blocked for your account')}}
function homeView(){return `<div class="content"><section class="hero"><div><h2>A trusted home for Muslim communities.</h2><p>Create private or public spaces for mosques, MSAs, Quran circles, organizations, families and Muslim groups — with messaging, events and Muslim-first tools.</p></div><div class="hero-actions"><button class="btn gold" id="heroCreate">Create community</button><button class="btn" id="heroDiscover">Discover</button></div></section><div class="grid"><div class="card"><h3>🔐 Privacy-first</h3><p>UID-based identity, member-scoped conversations, block/report foundations and security rules.</p></div><div class="card"><h3>🕌 Muslim-first</h3><p>Prayer times, Qibla, community events and a roadmap for Quran, Hadith and sourced AI tools.</p></div><div class="card"><h3>🏘️ Built for communities</h3><p>Admins can invite members, manage roles, create channels and build repeat community activity.</p></div></div><div class="section-head"><h2>My communities</h2><button class="btn" id="homeNew">+ New</button></div><div class="community-cards">${state.communities.length?state.communities.slice(0,6).map(communityCard).join(''):`<div class="card"><h3>Start the first community</h3><p>Invite a mosque, MSA, Quran group or local organization. Focused density beats an empty global feed.</p></div>`}</div><div class="section-head"><h2>Quick access</h2></div><div class="tools"><button class="tool" data-go="tools"><div>🕋</div><b>Prayer & Qibla</b><span>Location-based tools.</span></button><button class="tool" data-go="events"><div>📅</div><b>Events</b><span>Turn conversations into activity.</span></button><button class="tool" data-go="discover"><div>🔎</div><b>Discover</b><span>Find public communities.</span></button><button class="tool" data-go="messages"><div>✉️</div><b>Messages</b><span>Private conversations.</span></button></div></div>`}function communityCard(c){return `<div class="community-card"><div class="community-card-top"><div class="avatar">${initials(c.name)}</div><div><strong>${esc(c.name)} ${c.verified?'✓':''}</strong><div style="font-size:10px;color:var(--muted)">${esc(c.type||'community')} · ${c.visibility} · ${c.memberCount||1} members</div></div></div><p>${esc(c.description||'A Muslim community on Halal Chat.')}</p><div class="tags"><span class="tag">Chat</span><span class="tag">Events</span><span class="tag">Moderation</span></div><button class="btn primary" style="width:100%;margin-top:11px" data-open="${c.id}">Open community</button></div>`}
function discoverView(){const publicItems=state.communities.filter(c=>c.visibility==='public');return `<div class="content"><div class="section-head"><h2>Discover communities</h2><div style="display:flex;gap:7px"><button class="btn" id="inviteJoin">Join with invite</button><button class="btn primary" id="discoverCreate">+ Create</button></div></div><div class="notice">Public communities are discoverable. Private communities should be joined using an administrator-issued invite code.</div><div class="community-cards">${publicItems.length?publicItems.map(communityCard).join(''):`<div class="card"><h3>No public communities yet</h3><p>Create the first one and invite people who already know each other.</p></div>`}</div></div>`}
async function getLocation(){if(state.location)return state.location;if(!navigator.geolocation){toast('Location is not supported');return null}return new Promise(r=>navigator.geolocation.getCurrentPosition(p=>{state.location=p.coords;r(p.coords)},()=>r(null),{enableHighAccuracy:true,timeout:10000}))}function toolsView(){return `<div class="content"><div class="section-head"><h2>Muslim tools</h2><button class="btn" id="locBtn">Use my location</button></div><div class="tools"><button class="tool" id="prayerTool"><div>🕌</div><b>Prayer times</b><span>Daily schedule for your location.</span></button><button class="tool" id="qiblaTool"><div>🧭</div><b>Qibla</b><span>Direction from your location.</span></button><button class="tool" onclick="toast('Quran module is queued for the next release')"><div>📖</div><b>Quran</b><span>Searchable reading roadmap.</span></button><button class="tool" onclick="toast('Hadith module is queued for the next release')"><div>📚</div><b>Hadith & sources</b><span>References and attribution roadmap.</span></button></div><div id="toolResult" style="margin-top:18px"></div></div>`}async function loadPrayer(){const c=await getLocation();if(!c){toast('Allow location access to calculate prayer times');return}const box=$('toolResult');box.innerHTML='<div class="notice">Loading prayer times…</div>';try{const d=new Date(),u=`https://api.aladhan.com/v1/timings/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?latitude=${c.latitude}&longitude=${c.longitude}&method=2`,data=await fetch(u).then(r=>r.json()),t=data.data.timings;box.innerHTML=`<div class="card"><h3>Today's prayer times</h3><div class="prayer-row">${['Fajr','Dhuhr','Asr','Maghrib','Isha'].map(n=>`<div class="prayer"><b>${n}</b><span>${esc(t[n])}</span></div>`).join('')}</div><p style="margin-top:11px">Calculated for your location. Verify settings with your local mosque when precision matters.</p></div>`}catch(e){box.innerHTML='<div class="notice error">Prayer service unavailable right now.</div>'}}async function loadQibla(){const c=await getLocation();if(!c){toast('Allow location access to calculate Qibla');return}try{const d=await fetch(`https://api.aladhan.com/v1/qibla/${c.latitude}/${c.longitude}`).then(r=>r.json());$('toolResult').innerHTML=`<div class="card"><h3>Qibla direction</h3><div style="font-size:50px;text-align:center;margin:15px">🧭</div><p style="text-align:center;font-size:24px;font-weight:900">${Number(d.data.direction).toFixed(1)}°</p><p style="text-align:center">Bearing from true north.</p></div>`}catch(e){$('toolResult').innerHTML='<div class="notice error">Qibla service unavailable.</div>'}}
function eventsView(){return `<div class="content"><div class="section-head"><h2>Community events</h2><button class="btn primary" id="newEvent">+ Add event</button></div><div class="notice">Events create recurring reasons for communities to return. Add them to your community calendar once membership is established.</div><div id="eventsList" class="list"><div class="empty">Loading events…</div></div></div>`}async function loadEvents(){const box=$('eventsList');if(!box)return;try{const snap=await getDocs(query(collection(db,'events'),orderBy('startAt','asc'),limit(50)));box.innerHTML=snap.docs.length?snap.docs.map(e=>{const x=e.data();return `<div class="list-row"><div><b>${esc(x.title)}</b><div style="font-size:11px;color:var(--muted)">${fmt(x.startAt)} · ${esc(x.location||'Online')} ${x.communityId?'· Community event':''}</div></div><button class="btn small" data-rsvp="${e.id}">RSVP</button></div>`}).join(''):'<div class="empty">No events yet.</div>';document.querySelectorAll('[data-rsvp]').forEach(b=>b.onclick=()=>rsvp(b.dataset.rsvp))}catch(e){box.innerHTML='<div class="notice error">Could not load events. Deploy Firestore rules/indexes.</div>'}}async function rsvp(id){try{await setDoc(doc(db,'events',id,'attendees',state.user.uid),{uid:state.user.uid,status:'going',createdAt:serverTimestamp()});toast('RSVP saved')}catch(e){toast('Could not RSVP')}}function eventModal(){showModal(`<h2>Add an event</h2><div class="field"><label>Title</label><input id="eTitle" maxlength="80" placeholder="Quran study circle"></div><div class="field"><label>Date & time</label><input id="eDate" type="datetime-local"></div><div class="field"><label>Location</label><input id="eLocation" maxlength="100" placeholder="Community hall or online"></div><div class="field"><label>Community (optional)</label><select id="eCommunity"><option value="">General Halal Chat</option>${state.communities.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveEvent">Save</button></div>`);$('saveEvent').onclick=async()=>{const title=$('eTitle').value.trim(),dt=$('eDate').value,location=$('eLocation').value.trim(),communityId=$('eCommunity').value;if(!title||!dt){toast('Title and date are required');return}try{await addDoc(collection(db,'events'),{title,startAt:new Date(dt),location,communityId:communityId||null,createdBy:state.user.uid,createdAt:serverTimestamp()});closeModal();loadEvents();toast('Event added')}catch(e){toast('Could not add event')}}}
function render(){const main=$('main');if(state.view==='home')main.innerHTML=homeView();else if(state.view==='discover')main.innerHTML=discoverView();else if(state.view==='messages')main.innerHTML=messagesView();else if(state.view==='tools')main.innerHTML=toolsView();else if(state.view==='events')main.innerHTML=eventsView();else if(state.view==='community')main.innerHTML=communityView();renderCommunityList();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCommunity(b.dataset.open));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));$('heroCreate')?.addEventListener('click',communityModal);$('heroDiscover')?.addEventListener('click',()=>nav('discover'));$('homeNew')?.addEventListener('click',communityModal);$('discoverCreate')?.addEventListener('click',communityModal);$('inviteJoin')?.addEventListener('click',inviteJoinModal);$('sendBtn')?.addEventListener('click',sendMessage);$('messageInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('communityInfoBtn')?.addEventListener('click',communityInfo);$('newDm')?.addEventListener('click',newDmModal);$('prayerTool')?.addEventListener('click',loadPrayer);$('qiblaTool')?.addEventListener('click',loadQibla);$('locBtn')?.addEventListener('click',loadPrayer);$('newEvent')?.addEventListener('click',eventModal);if(state.view==='events')loadEvents();if(state.view==='messages')loadDms();if(state.view==='community')subscribeMessages();if(state.profile)$('profileCard').innerHTML=`<div class="avatar">${initials(state.profile.displayName)}</div><div class="meta"><strong>${esc(state.profile.displayName)}</strong><span>${state.user.isAnonymous?'Guest account':'Verified account'}</span></div>`}
onAuthStateChanged(auth,async user=>{stopCommunitySubscriptions();if(!user){try{await signInAnonymously(auth)}catch(e){$('main').innerHTML=`<div class="content"><div class="notice error"><b>Firebase Authentication is not enabled.</b><br><br>Enable Anonymous sign-in, Email/Password and optionally Google in Firebase Console → Authentication → Sign-in method.</div><button class="btn primary" style="margin-top:10px" onclick="authModal()">Sign in</button></div>`}return}state.user=user;try{await ensureProfile();await loadCommunities();render();$('profileBtn').textContent=user.isAnonymous?'Create account':'Profile';if(!user.isAnonymous&&!state.profile?.onboardingComplete)setTimeout(()=>onboardingModal(false),350)}catch(e){console.error(e);$('main').innerHTML='<div class="content"><div class="notice error">Could not initialize your account. Check Firebase configuration and Firestore rules.</div></div>'}});window.authModal=authModal;
</script></body></html>
